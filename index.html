<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

      user-select: none;
      -webkit-user-select: none;
    }

    body {
      margin: 0;
      padding: 0;
      overflow: hidden;
      background-color: #020617;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #f1f5f9;
    }

    }

    .font-mono-tech {
      font-family: 'JetBrains Mono', monospace;
    }

    /* Estilos Espaciais Glassmorphism Translúcidos */
    .glass-dock {
      background: rgba(8, 14, 26, 0.85);
      backdrop-filter: blur(24px) saturate(180%);
      -webkit-backdrop-filter: blur(24px) saturate(180%);
      border: 1px solid rgba(0, 240, 255, 0.25);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.7),
                  0 0 20px rgba(0, 240, 255, 0.15);
    }

    .btn-spatial {

      border: 1px solid rgba(255, 255, 255, 0.14);
      transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);

      transform: translateY(-1px);

      box-shadow: 0 0 20px rgba(0, 240, 255, 0.45) !important;
      color: #ffffff !important;
    }

    .hud-transition {
      transition: opacity 0.3s ease, transform 0.3s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .hud-hidden {
      opacity: 0;
      pointer-events: none !important;
      transform: translateY(-20px);
    }
  </style>
</head>

  <!-- ============================================================== -->
  <!-- SISTEMA DE ÁUDIO PROCEDURAL WEB AUDIO API                       -->
  <!-- ============================================================== -->
  <script>
    let audioCtx = null;
    let isEcgAudioActive = true;

    function initAudio() {
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) {
            audioCtx = new AudioContextClass();
          }
        }
        if (audioCtx && audioCtx.state === 'suspended') {
          audioCtx.resume();
        }
      } catch (e) {
        console.warn('Audio init silent error:', e);
      }
    }

    function playBeep(freq = 880) {
      if (!audioCtx || !isEcgAudioActive) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.05, now + 0.07);

        gain.gain.setValueAtTime(0.025, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.08);

        osc.start(now);
        osc.stop(now + 0.08);
      } catch (e) {}
    }

    function playToolSound(tool) {
      initAudio();
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (tool === 'scalpel') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(1200, now);
          osc.frequency.exponentialRampToValueAtTime(600, now + 0.18);
          gain.gain.setValueAtTime(0.05, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.18);
          osc.start(now);
          osc.stop(now + 0.18);
        } else if (tool === 'cautery') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(260, now);
          osc.frequency.linearRampToValueAtTime(320, now + 0.22);
          gain.gain.setValueAtTime(0.06, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.22);
          osc.start(now);
          osc.stop(now + 0.22);
        } else if (tool === 'suction') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(350, now);
          osc.frequency.linearRampToValueAtTime(180, now + 0.28);
          gain.gain.setValueAtTime(0.05, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.28);
          osc.start(now);
          osc.stop(now + 0.28);
        } else if (tool === 'laser') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(2400, now);
          osc.frequency.exponentialRampToValueAtTime(500, now + 0.15);
          gain.gain.setValueAtTime(0.07, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.15);
          osc.start(now);
          osc.stop(now + 0.15);
        }
      } catch (e) {}
    }

    function toggleEcgAudio() {
      initAudio();
      isEcgAudioActive = !isEcgAudioActive;
      const btn = document.getElementById('btn-ecg-audio');
      if (btn) {
        btn.textContent = isEcgAudioActive ? '🔊' : '🔇';
        btn.className = isEcgAudioActive ? 'btn-spatial p-2 rounded-xl text-emerald-400' : 'btn-spatial p-2 rounded-xl text-gray-500';
      }
    }

    setInterval(() => {
      playBeep(880);
    }, 850);

    window.addEventListener('click', () => {
      initAudio();
    }, { once: true });
  </script>

  <!-- ============================================================== -->
  <!-- SISTEMA PRINCIPAL THREE.JS: DISPOSIÇÃO ESPACIAL TOTALMENTE SEPARADA -->
  <!-- ============================================================== -->
  <script>
    const VRButtonHelper = {
      createButton: function (renderer) {
        const button = document.createElement('button');

        function showEnterVR() {
          let currentSession = null;

          async function onSessionStarted(session) {
            session.addEventListener('end', onSessionEnded);
            await renderer.xr.setSession(session);
            button.textContent = 'SAIR DO VR';
            currentSession = session;
          }

          function onSessionEnded() {
            currentSession.removeEventListener('end', onSessionEnded);
            button.textContent = 'ENTRAR EM VR';
            currentSession = null;
          }

          button.style.display = '';
          button.style.cursor = 'pointer';
          button.textContent = 'ENTRAR EM VR';

          button.onclick = function () {
            if (currentSession === null) {
              const sessionInit = { optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking'] };
              navigator.xr.requestSession('immersive-vr', sessionInit).then(onSessionStarted).catch(function (err) {
                console.warn('Falha WebXR:', err);
              });
            } else {
              currentSession.end();
            }
          };
        }

        function disableButton() {
          button.style.display = '';
          button.style.cursor = 'auto';
          button.textContent = 'VR DISPONÍVEL NO QUEST';
          button.style.opacity = '0.5';
          button.onclick = null;
        }

        button.className = "px-3 py-1.5 rounded-xl bg-gradient-to-r from-cyan-500 to-sky-600 text-black font-mono-tech font-bold text-xs shadow-lg shadow-cyan-500/20 active:scale-95";

        if ('xr' in navigator) {
          navigator.xr.isSessionSupported('immersive-vr').then(function (supported) {
            supported ? showEnterVR() : disableButton();
          }).catch(disableButton);
        } else {
          disableButton();
        }

        return button;
      }
    };

    let scene, camera, renderer, controls;
    let clock = new THREE.Clock();

    // Entidades do Cenário
    let surgicalFieldGroup, brainTumorMesh, craniotomyRingMesh, tool3DMesh;
    let telemetryBoardGroup, telemetryCanvas, telemetryCtx, telemetryTexture;
    let videoTheaterGroup, videoTexture, videoElement, videoScreenMesh;
    let patientChestMesh, patientHeadMesh;
    let currentTool = 'scalpel';
    let tumorHealth = 100;

    // Raycaster para cliques no paciente ou telas
    let raycaster = new THREE.Raycaster();
    let mouse = new THREE.Vector2();

    function setupORLighting() {
      // Luz ambiente cirúrgica fria e difusa
      const ambientLight = new THREE.AmbientLight(0x0f1d36, 1.4);
      scene.add(ambientLight);

      // Foco Cirúrgico Central (Scialytic Light - Temperatura 4500K / Branca Neutra Estéril)
      const surgicalLight = new THREE.SpotLight(0xfff8ee, 4.2);
      surgicalLight.position.set(0.2, 3.4, 0.4);
      surgicalLight.target.position.set(0, 1.16, 0);
      surgicalLight.angle = Math.PI / 4.8;
      surgicalLight.penumbra = 0.35;
      surgicalLight.castShadow = true;
      scene.add(surgicalLight);
      scene.add(surgicalLight.target);

      // Foco Cirúrgico Secundário de Contorno (Rim Light Ciano Médico)
      const secondaryLight = new THREE.SpotLight(0x38bdf8, 2.2);
      secondaryLight.position.set(-0.8, 3.0, 0.2);
      secondaryLight.target.position.set(0, 1.16, 0);
      secondaryLight.angle = Math.PI / 4.2;
      secondaryLight.penumbra = 0.5;
      scene.add(secondaryLight);
      scene.add(secondaryLight.target);

      // Luz suave de fundo
      const theaterLight = new THREE.PointLight(0x0284c7, 1.2, 9);
      theaterLight.position.set(2.6, 2.2, -0.6);
      scene.add(theaterLight);

      const telemetryLight = new THREE.PointLight(0x10b981, 1.0, 9);
      telemetryLight.position.set(-2.6, 2.2, -0.6);
      scene.add(telemetryLight);
    }

    function buildArchitecturalRoom() {
      // Piso vinílico condutivo com reflexos sutis de centro cirúrgico
      const floorGeo = new THREE.PlaneGeometry(18, 18);
      const floorMat = new THREE.MeshStandardMaterial({
        color: 0x050b14,
        roughness: 0.18,
        metalness: 0.65
      });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = 0;
      scene.add(floor);

      const grid = new THREE.GridHelper(18, 36, 0x0ea5e9, 0x1e293b);
      grid.position.y = 0.005;
      scene.add(grid);

      // Cúpula Scialítica Moderna
      const domeArm = new THREE.Mesh(
        new THREE.CylinderGeometry(0.04, 0.04, 1.2, 16),
        new THREE.MeshStandardMaterial({ color: 0x64748b, metalness: 0.9, roughness: 0.2 })
      );
      domeArm.rotation.z = Math.PI / 3;
      domeArm.position.set(-0.5, 3.4, 0.4);
      scene.add(domeArm);

      const scialyticMount = new THREE.Mesh(
        new THREE.CylinderGeometry(0.55, 0.65, 0.1, 32),
        new THREE.MeshStandardMaterial({ color: 0x334155, metalness: 0.85, roughness: 0.2 })
      );
      scialyticMount.position.set(0.2, 3.4, 0.4);
      scene.add(scialyticMount);

      // Emissores LED Cirúrgicos circulares
      for (let i = 0; i < 6; i++) {
        const angle = (i / 6) * Math.PI * 2;
        const led = new THREE.Mesh(
          new THREE.CylinderGeometry(0.1, 0.1, 0.02, 16),
          new THREE.MeshBasicMaterial({ color: 0xffffff })
        );
        led.position.set(0.2 + Math.cos(angle) * 0.32, 3.34, 0.4 + Math.sin(angle) * 0.32);
        scene.add(led);
      }
    }

    function createProceduralSkinTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#e5b89a';
      ctx.fillRect(0, 0, 512, 512);

      for (let i = 0; i < 12000; i++) {
        const x = Math.random() * 512;
        const y = Math.random() * 512;
        const radius = Math.random() * 1.5;
        const shade = Math.random() > 0.5 ? 'rgba(180, 110, 90, 0.06)' : 'rgba(255, 235, 220, 0.08)';
        ctx.fillStyle = shade;
        ctx.beginPath();
        ctx.arc(x, y, radius, 0, Math.PI * 2);
        ctx.fill();
      }

      const grad = ctx.createRadialGradient(256, 256, 40, 256, 256, 250);
      grad.addColorStop(0, 'rgba(235, 160, 140, 0.12)');
      grad.addColorStop(1, 'rgba(180, 115, 95, 0.18)');
      ctx.fillStyle = grad;
      ctx.fillRect(0, 0, 512, 512);

      const texture = new THREE.CanvasTexture(canvas);
      texture.wrapS = THREE.RepeatWrapping;
      texture.wrapT = THREE.RepeatWrapping;
      return texture;
    }

    function createProceduralCortexTexture() {
      const canvas = document.createElement('canvas');
      canvas.width = 512;
      canvas.height = 512;
      const ctx = canvas.getContext('2d');

      ctx.fillStyle = '#cf6f7e';
      ctx.fillRect(0, 0, 512, 512);

      ctx.strokeStyle = '#7c2533';
      ctx.lineWidth = 9;
      ctx.lineCap = 'round';
      ctx.lineJoin = 'round';

      for (let i = 0; i < 45; i++) {
        ctx.beginPath();
        let px = Math.random() * 512;
        let py = Math.random() * 512;
        ctx.moveTo(px, py);
        for (let j = 0; j < 6; j++) {
          px += (Math.random() - 0.5) * 80;
          py += (Math.random() - 0.5) * 80;
          ctx.quadraticCurveTo(px + (Math.random() - 0.5) * 30, py + (Math.random() - 0.5) * 30, px, py);
        }
        ctx.stroke();
      }

      ctx.strokeStyle = '#b91c1c';
      ctx.lineWidth = 2.5;
      for (let i = 0; i < 35; i++) {
        ctx.beginPath();
        let vx = Math.random() * 512;
        let vy = Math.random() * 512;
        ctx.moveTo(vx, vy);
        for (let k = 0; k < 4; k++) {
          vx += (Math.random() - 0.5) * 60;
          vy += (Math.random() - 0.5) * 60;
          ctx.lineTo(vx, vy);
        }
        ctx.stroke();
      }

      const texture = new THREE.CanvasTexture(canvas);
      return texture;
    }

    function buildRealisticHead() {
      const headMasterGroup = new THREE.Group();
      headMasterGroup.position.set(0, 1.18, 0.04);

      const skinTex = createProceduralSkinTexture();
      const skinMaterial = new THREE.MeshStandardMaterial({
        color: 0xdeb89e,
        roughness: 0.55,
        metalness: 0.04,
        map: skinTex
      });

      // 1. Crânio Humano Orgânico com Escultura Anatômica por Vértices
      const craniumGeo = new THREE.SphereGeometry(0.18, 48, 48);
      craniumGeo.scale(0.82, 1.05, 0.98);

      const pos = craniumGeo.attributes.position;
      for (let i = 0; i < pos.count; i++) {
        let x = pos.getX(i);
        let y = pos.getY(i);
        let z = pos.getZ(i);

        if (y < -0.04 && z > 0) {
          x *= 0.88;
          if (y < -0.1) z += 0.025;
        }
        if (Math.abs(x) > 0.11 && y > 0.02 && z < 0.06) {
          x *= 0.94;
        }
        if (z < -0.05 && y > 0.0) {
          z -= 0.015;
        }

        pos.setXYZ(i, x, y, z);
      }
      craniumGeo.computeVertexNormals();

      patientHeadMesh = new THREE.Mesh(craniumGeo, skinMaterial);
      headMasterGroup.add(patientHeadMesh);

      // 2. Nariz Orgânico Modelado

    function buildRealisticDrapedBody() {
      const bodyGroup = new THREE.Group();
      bodyGroup.position.set(0, 1.05, -0.6);

      const fabricCanvas = document.createElement('canvas');
      fabricCanvas.width = 256;
      fabricCanvas.height = 256;
      const fCtx = fabricCanvas.getContext('2d');
      fCtx.fillStyle = '#0284c7';
      fCtx.fillRect(0, 0, 256, 256);
      fCtx.fillStyle = '#0369a1';
      for (let i = 0; i < 256; i += 4) {
        fCtx.fillRect(i, 0, 1, 256);
        fCtx.fillRect(0, i, 256, 1);
      }
      const drapeTexture = new THREE.CanvasTexture(fabricCanvas);
      drapeTexture.wrapS = THREE.RepeatWrapping;
      drapeTexture.wrapT = THREE.RepeatWrapping;
      drapeTexture.repeat.set(12, 18);

      const drapeMaterial = new THREE.MeshStandardMaterial({
        color: 0x0284c7,
        roughness: 0.88,
        metalness: 0.02,
        map: drapeTexture,
        side: THREE.DoubleSide
      });

      const drapeWidth = 1.1;
      const drapeLength = 2.1;
      const drapeGeo = new THREE.PlaneGeometry(drapeWidth, drapeLength, 48, 64);
      drapeGeo.rotation.x = -Math.PI / 2;

      const vPos = drapeGeo.attributes.position;
      for (let i = 0; i < vPos.count; i++) {
        let x = vPos.getX(i);
        let y = vPos.getY(i);
        let z = vPos.getZ(i);

        const normalizedZ = y;
        let height = 0;

        if (normalizedZ > 0.4 && normalizedZ < 1.0) {
          const chestCenterDist = Math.abs(x);
          if (chestCenterDist < 0.3) {
            height = 0.17 * Math.cos((chestCenterDist / 0.3) * (Math.PI / 2.2));
          } else if (chestCenterDist < 0.46) {
            height = 0.11 * Math.cos(((chestCenterDist - 0.3) / 0.16) * (Math.PI / 2.2));
          }
        } else if (normalizedZ > 0.1 && normalizedZ <= 0.4) {
          const abdDist = Math.abs(x);
          if (abdDist < 0.28) {
            height = 0.13 * Math.cos((abdDist / 0.28) * (Math.PI / 2.2));
          }
        } else if (normalizedZ > -0.2 && normalizedZ <= 0.1) {
          const pelvDist = Math.abs(x);
          if (pelvDist < 0.3) {
            height = 0.14 * Math.cos((pelvDist / 0.3) * (Math.PI / 2.2));
          }
        } else if (normalizedZ > -0.85 && normalizedZ <= -0.2) {
          const legLX = Math.abs(x + 0.16);
          const legRX = Math.abs(x - 0.16);
          const legDist = Math.min(legLX, legRX);
          if (legDist < 0.14) {
            height = 0.13 * Math.cos((legDist / 0.14) * (Math.PI / 2.2));
          }
        } else if (normalizedZ <= -0.85) {
          const footLX = Math.abs(x + 0.14);
          const footRX = Math.abs(x - 0.14);
          const footDist = Math.min(footLX, footRX);
          if (footDist < 0.1) {
            height = 0.16 * (1.0 - footDist / 0.1);
          }
        }

        if (Math.abs(x) > 0.44) {
          const falloff = (Math.abs(x) - 0.44) / (drapeWidth / 2 - 0.44);
          height -= falloff * 0.28;
        }

        const microFold = Math.sin(normalizedZ * 28.0 + x * 10.0) * 0.006 + Math.cos(x * 32.0) * 0.004;
        height += microFold;

        vPos.setZ(i, height);
      }
      drapeGeo.computeVertexNormals();

      const drapeMesh = new THREE.Mesh(drapeGeo, drapeMaterial);
      drapeMesh.position.set(0, 0, 0);
      patientChestMesh = drapeMesh;
      bodyGroup.add(drapeMesh);

      // Braço lateral e mãos
      const skinTex = createProceduralSkinTexture();
      const armSkinMat = new THREE.MeshStandardMaterial({ color: 0xdeb89e, roughness: 0.6, map: skinTex });

      const handLeft = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.03, 0.14), armSkinMat);
      handLeft.position.set(-0.48, -0.04, 0.0);
      bodyGroup.add(handLeft);

      const handRight = new THREE.Mesh(new THREE.BoxGeometry(0.08, 0.03, 0.14), armSkinMat);
      handRight.position.set(0.48, -0.04, 0.0);
      bodyGroup.add(handRight);

      // Oxímetro de pulso SpO2
      const oximeterClip = new THREE.Mesh(
        new THREE.BoxGeometry(0.026, 0.022, 0.045),
        new THREE.MeshStandardMaterial({ color: 0x1e293b, roughness: 0.3 })
      );
      oximeterClip.position.set(-0.48, -0.025, -0.06);
      bodyGroup.add(oximeterClip);

      const oximeterLed = new THREE.Mesh(
        new THREE.SphereGeometry(0.007, 8, 8),
        new THREE.MeshBasicMaterial({ color: 0xef4444 })
      );
      oximeterLed.position.set(-0.48, -0.015, -0.06);
      bodyGroup.add(oximeterLed);

      const cable = new THREE.Mesh(
        new THREE.CylinderGeometry(0.003, 0.003, 0.6, 8),
        new THREE.MeshStandardMaterial({ color: 0x475569 })
      );
      cable.rotation.x = Math.PI / 4;
      cable.position.set(-0.48, -0.15, -0.2);
      bodyGroup.add(cable);

      return bodyGroup;
    }

    let ecgTick = 0;
    function updateTelemetryCanvas() {
      if (!telemetryCtx) return;
      const ctx = telemetryCtx;
      const w = telemetryCanvas.width;
      const h = telemetryCanvas.height;

      ctx.fillStyle = '#060d1f';
      ctx.fillRect(0, 0, w, h);

      ctx.fillStyle = '#00f0ff';
      ctx.font = 'bold 36px "JetBrains Mono", monospace';
      ctx.fillText("TELEMETRIA CIRÚRGICA // PACIENTE ID-894", 40, 60);

      ctx.fillStyle = '#64748b';
      ctx.font = '24px "JetBrains Mono", monospace';
      ctx.fillText("UTI NEUROCIRÚRGICA • NAVEGAÇÃO ATIVA", 40, 100);

      ctx.strokeStyle = '#00f0ff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(40, 120);
      ctx.lineTo(w - 40, 120);
      ctx.stroke();

      ctx.fillStyle = '#10b981';
      ctx.font = 'bold 48px "JetBrains Mono", monospace';
      ctx.fillText("ECG DERIVAÇÃO II", 40, 180);
      ctx.fillText("72 BPM", w - 240, 180);

      ctx.strokeStyle = '#10b981';
      ctx.lineWidth = 4;
      ctx.shadowColor = '#00f0ff';
      ctx.shadowBlur = 10;
      ctx.beginPath();
      ctx.moveTo(40, 270);

      ecgTick += 4;
      if (ecgTick > w - 80) ecgTick = 0;

      for (let x = 40; x < w - 40; x += 10) {
        const relX = (x + ecgTick) % 240;
        let y = 270;
        if (relX > 60 && relX < 80) y -= 15;
        else if (relX >= 90 && relX < 100) y += 10;
        else if (relX >= 100 && relX < 115) y -= 75;
        else if (relX >= 115 && relX < 125) y += 25;
        else if (relX >= 150 && relX < 180) y -= 25;
        ctx.lineTo(x, y);
      }
      ctx.stroke();
      ctx.shadowBlur = 0;

      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 34px "JetBrains Mono", monospace';
      ctx.fillText("PA: 120/80 mmHg", 40, 380);
      ctx.fillText("SpO₂: 99%", 440, 380);
      ctx.fillText("PIC: 11.4 mmHg", 720, 380);

      ctx.fillStyle = '#f8fafc';
      ctx.font = 'bold 30px "Chakra Petch", sans-serif';
      ctx.fillText(`VOLUME DA LESÃO (GLIOMA): ${tumorHealth}%`, 40, 480);

      ctx.fillStyle = '#1e293b';
      ctx.fillRect(40, 510, w - 80, 40);
      ctx.fillStyle = tumorHealth > 30 ? '#10b981' : '#00f0ff';
      ctx.fillRect(40, 510, (w - 80) * (tumorHealth / 100), 40);

      ctx.fillStyle = '#e2e8f0';
      ctx.font = '28px "Plus Jakarta Sans", sans-serif';
      ctx.fillText("Conduta: Mantenha a hemostasia e aspire a margem com CUSA.", 40, 620);
      ctx.fillText("Status da Hemostasia: 100% sob controle estéril.", 40, 670);

      telemetryTexture.needsUpdate = true;
    }

    function buildInstrumentTrayAtWaist() {
      const trayGroup = new THREE.Group();
      trayGroup.position.set(0, 0.85, 0.65);
      trayGroup.rotation.x = -Math.PI / 6;

      const table = new THREE.Mesh(
        new THREE.BoxGeometry(0.9, 0.28, 0.04),
        new THREE.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.8, roughness: 0.2 })
      );
      trayGroup.add(table);

      const tableGlow = new THREE.Mesh(
        new THREE.BoxGeometry(0.92, 0.3, 0.01),
        new THREE.MeshBasicMaterial({ color: 0x00f0ff })
      );
      tableGlow.position.z = -0.02;
      trayGroup.add(tableGlow);

      scene.add(trayGroup);
    }

    function selectTool(toolKey) {
      currentTool = toolKey;

      ['scalpel', 'cautery', 'suction', 'laser'].forEach(key => {
        const btn = document.getElementById(`tool-${key}`);
        if (btn) {
          if (key === toolKey) btn.className = 'btn-spatial btn-spatial-active px-3 py-1.5 rounded-xl text-xs font-hud font-bold flex items-center gap-1.5';
          else btn.className = 'btn-spatial px-3 py-1.5 rounded-xl text-xs font-hud font-bold flex items-center gap-1.5 text-gray-300';
        }
      });

      buildActive3DTool();
      playToolSound(toolKey);
      showToast(`Instrumento Ativo: ${toolKey.toUpperCase()}`);
    }

    function executeSurgicalAction() {
      playToolSound(currentTool);

      if (tool3DMesh) {
        tool3DMesh.position.y -= 0.06;
        setTimeout(() => {
          if (tool3DMesh) tool3DMesh.position.y += 0.06;
        }, 140);
      }

      tumorHealth = Math.max(0, tumorHealth - 25);
      if (brainTumorMesh) {
        const s = Math.max(0.1, tumorHealth / 100);
        brainTumorMesh.scale.set(s, s, s);
        if (tumorHealth === 0) {
          brainTumorMesh.visible = false;
          showToast("✨ LESÃO RESSECADA COM SUCESSO! MARGEM PRESERVADA.");
        } else {
          showToast(`Ação aplicada [Tumor restante: ${tumorHealth}%]`);
        }
      }

      updateTelemetryCanvas();
    }

    function onScenePointerClick(event) {
      if (!camera) return;
      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;

      raycaster.setFromCamera(mouse, camera);

      if (surgicalFieldGroup) {
        const hits = raycaster.intersectObjects(surgicalFieldGroup.children, true);
        if (hits.length > 0) {
          executeSurgicalAction();
          return;
        }
      }

      if (videoTheaterGroup) {
        const hits = raycaster.intersectObjects(videoTheaterGroup.children, true);
        if (hits.length > 0) {
          const hitObj = hits[0].object;
          if (hitObj.name === "btn_video_toggle") toggleVideoPlayback();
          else if (hitObj.name === "btn_video_mute") toggleVideoMute();
        }
      }
    }

    function handleUserVideoFile(event) {
      const file = event.target.files[0];
      if (!file || !videoElement) return;

      const url = URL.createObjectURL(file);
      videoElement.src = url;
      videoElement.muted = false;
      videoElement.load();
      videoElement.play();

      setCameraView('theater');
      showToast(`Vídeo carregado: ${file.name.substring(0, 20)}...`);
    }

    function toggleVideoPlayback() {
      if (!videoElement) return;
      initAudio();
      if (videoElement.paused) {
        videoElement.play();
        showToast("🎬 Telão: Reproduzindo vídeo");
      } else {
        videoElement.pause();
        showToast("⏸️ Telão: Pausado");
      }
    }

    function toggleVideoMute() {
      if (!videoElement) return;
      videoElement.muted = !videoElement.muted;
      showToast(videoElement.muted ? "🔇 Telão no Mudo" : "🔊 Áudio do Telão Ativado");
    }

    let toastTimeout = null;
    function showToast(msg) {
      const toast = document.getElementById('action-toast');
      const text = document.getElementById('toast-message');
      if (!toast || !text) return;

      text.textContent = msg;
      toast.classList.remove('opacity-0');

      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => {
        toast.classList.add('opacity-0');
      }, 2600);
    }

    let isCleanField = false;
    function toggleCleanFieldMode() {
      isCleanField = !isCleanField;
      const topBar = document.getElementById('top-bar');
      const bottomDock = document.getElementById('bottom-dock');
      const restoreBtn = document.getElementById('restore-hud-btn');

      if (isCleanField) {
        if (topBar) topBar.classList.add('hud-hidden');
        if (bottomDock) bottomDock.classList.add('hud-hidden');
        if (restoreBtn) restoreBtn.classList.remove('hidden');
      } else {
        if (topBar) topBar.classList.remove('hud-hidden');
        if (bottomDock) bottomDock.classList.remove('hud-hidden');
        if (restoreBtn) restoreBtn.classList.add('hidden');
      }
    }

    function setCameraView(viewKey) {
      ['surgery', 'theater', 'monitor', 'overview'].forEach(k => {
        const btn = document.getElementById(`cam-btn-${k}`);
        if (btn) {
          if (k === viewKey) btn.className = 'btn-spatial btn-spatial-active px-3 py-1.5 rounded-xl text-xs font-mono-tech flex items-center gap-1.5';
          else btn.className = 'btn-spatial px-3 py-1.5 rounded-xl text-xs font-mono-tech text-gray-300 flex items-center gap-1.5';
        }
      });

      if (!camera || !controls) return;

      if (viewKey === 'surgery') {
        camera.position.set(0, 1.6, 1.4);
        controls.target.set(0, 1.18, 0);
      } else if (viewKey === 'theater') {
        camera.position.set(0.6, 1.7, 0.8);
        controls.target.set(2.4, 1.8, -0.6);
      } else if (viewKey === 'monitor') {
        camera.position.set(-0.6, 1.7, 0.8);
        controls.target.set(-2.4, 1.8, -0.6);
      } else if (viewKey === 'overview') {
        camera.position.set(0, 2.4, 3.2);
        controls.target.set(0, 1.2, 0);
      }
    }

    function initSpatialOperatingRoom() {
      const container = document.getElementById('webgl-container');
      const width = window.innerWidth;
      const height = window.innerHeight;

      scene = new THREE.Scene();
      scene.fog = new THREE.FogExp2(0x020617, 0.04);

      camera = new THREE.PerspectiveCamera(50, width / height, 0.1, 100);
      camera.position.set(0, 1.6, 1.4);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.25;
      renderer.xr.enabled = true;
      container.appendChild(renderer.domElement);

      const vrBtn = VRButtonHelper.createButton(renderer);
      const vrMount = document.getElementById('vr-button-mount');
      if (vrMount) vrMount.appendChild(vrBtn);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxPolarAngle = Math.PI / 2 + 0.08;
      controls.minDistance = 0.4;
      controls.maxDistance = 10;
      controls.target.set(0, 1.15, 0);

      setupORLighting();
      buildArchitecturalRoom();
      buildCentralSurgicalField();
      buildRightSideTheaterScreen();
      buildLeftSideTelemetryMonitor();
      buildInstrumentTrayAtWaist();

      window.addEventListener('resize', onWindowResize);
      window.addEventListener('click', onScenePointerClick);

      renderer.setAnimationLoop(renderLoop);
    }

    let lastEcgUpdate = 0;
    function renderLoop(timestamp) {
      const time = clock.getElapsedTime();

      if (controls) controls.update();

      if (patientChestMesh) {
        const breathCycle = Math.sin(time * 1.5) * 0.015;
        patientChestMesh.position.y = breathCycle;
        patientChestMesh.scale.y = 1.0 + breathCycle * 0.35;
      }

      if (brainTumorMesh && brainTumorMesh.visible) {
        const pulse = (tumorHealth / 100) * (1.0 + Math.sin(time * 4.0) * 0.08);
        brainTumorMesh.scale.set(pulse, pulse, pulse);
      }

      if (craniotomyRingMesh) {
        craniotomyRingMesh.rotation.z += 0.005;
      }

      if (timestamp - lastEcgUpdate > 80) {
        updateTelemetryCanvas();
        lastEcgUpdate = timestamp;
      }

      renderer.render(scene, camera);
    }

    function onWindowResize() {
      if (!camera || !renderer) return;
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    window.onload = function () {
      initSpatialOperatingRoom();
      setCameraView('surgery');
    };
  </script>
</body>
</html>
