<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>CYBER-MED // Terminal Histórico Holográfico</title>
  
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>

  <style>
    body { margin: 0; overflow: hidden; background: #000; }
  </style>

  <script>
    // Gerador de Som Sci-Fi procedural via Web Audio API (Dispensa arquivos de MP3)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playSciFiSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'hover') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(800, now);
        osc.frequency.exponentialRampToValueAtTime(1200, now + 0.08);
        gain.gain.setValueAtTime(0.04, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
      } else if (type === 'click') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(300, now);
        osc.frequency.exponentialRampToValueAtTime(900, now + 0.15);
        gain.gain.setValueAtTime(0.08, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.15);
        osc.start(now);
        osc.stop(now + 0.15);
      }
    }

    // Base de dados dos períodos
    const timelineData = [
      {
        epoca: "01 // EGITO ANTIGO",
        periodo: "3000 a.C.",
        subtitulo: "PRÁTICAS SACRAS E ANATOMIA PRIMORDIAL",
        topicos: [
          "[+] Uso sistemático de fitoterápicos e minerais.",
          "[+] Primeiras intervenções cirúrgicas documentadas.",
          "[+] Medicina integrada a deuses e ritos fúnebres.",
          "[+] Papiros médicos: registros de diagnósticos e traumas.",
          "[+] Mumificação como base dos primeiros estudos anatômicos."
        ],
        hologramType: "egypt"
      },
      {
        epoca: "02 // GRÉCIA ANTIGA",
        periodo: "400 a.C.",
        subtitulo: "NASCIMENTO DA MEDICINA RACIONAL",
        topicos: [
          "[+] Hipócrates: rompimento com causas sobrenaturais.",
          "[+] Observação empírica dos sintomas clínicos.",
          "[+] Teoria humoral e equilíbrio orgânico do corpo.",
          "[+] Estabelecimento dos primeiros códigos de ética médica.",
          "[+] Construção do vínculo humanizado médico-paciente."
        ],
        hologramType: "greece"
      },
      {
        epoca: "03 // IDADE MÉDIA",
        periodo: "500 a 1500",
        subtitulo: "ENCICLOPEDISMO E EXPANSÃO CLÍNICA",
        topicos: [
          "[+] Fundação das primeiras universidades e hospitais formais.",
          "[+] Idade de ouro da medicina árabe e persa.",
          "[+] Avicena sistematiza o saber no 'Cânone da Medicina'.",
          "[+] Farmacopeias complexas e catalogação de compostos.",
          "[+] Preservação de manuscritos clássicos em mosteiros."
        ],
        hologramType: "middle_ages"
      },
      {
        epoca: "04 // RENASCIMENTO",
        periodo: "1500 a 1600",
        subtitulo: "A REVOLUÇÃO ANATÔMICA EXPERIMENTAL",
        topicos: [
          "[+] Andreas Vesalius publica 'De Humani Corporis Fabrica'.",
          "[+] Dissecações cadavéricas quebram dogmas de Galeno.",
          "[+] Ilustrações artísticas hiper-realistas da anatomia.",
          "[+] Valorização da experimentação e do método empírico."
        ],
        hologramType: "renaissance"
      },
      {
        epoca: "05 // SÉCULO XVII",
        periodo: "1600",
        subtitulo: "MICROCOSMO E HEMODINÂMICA",
        topicos: [
          "[+] William Harvey demonstra a circulação fechada do sangue (1628).",
          "[+] Nascimento da microscopia com lentes polidas.",
          "[+] Robert Hooke batiza a 'célula' em 1665.",
          "[+] Leeuwenhoek descobre os microrganismos vivos (1670)."
        ],
        hologramType: "microscope"
      },
      {
        epoca: "06 // SÉCULOS XVIII E XIX",
        periodo: "1700 a 1899",
        subtitulo: "ANTISSEPSIA, ANESTESIA E RAIOS-X",
        topicos: [
          "[+] 1796: Edward Jenner desenvolve a vacina contra a varíola.",
          "[+] 1846: Primeira demonstração pública da anestesia cirúrgica.",
          "[+] Pasteur consolida a teoria microbiana das infecções.",
          "[+] 1867: Lister revoluciona o centro cirúrgico com antissepsia.",
          "[+] 1895: Wilhelm Röntgen desvela o interior do corpo via Raios X."
        ],
        hologramType: "industrial"
      },
      {
        epoca: "07 // SÉCULO XX",
        periodo: "1900 a 1999",
        subtitulo: "ERA BIOTECNOLÓGICA E DIAGNÓSTICO AVANÇADO",
        topicos: [
          "[+] 1928: Fleming descobre a penicilina (início dos antibióticos).",
          "[+] 1953: Watson & Crick desvendam a dupla hélice do DNA.",
          "[+] 1967: Christiaan Barnard realiza o 1º transplante cardíaco.",
          "[+] Tomografia Computadorizada e Ressonância Magnética.",
          "[+] 1985: Cirurgias minimamente invasivas guiadas por robótica."
        ],
        hologramType: "dna"
      },
      {
        epoca: "SÍNTESE // HORIZONTE",
        periodo: "Século XXI+",
        subtitulo: "MEDICINA DE PRECISÃO E CIBERNÉTICA",
        topicos: [
          "Da observação do corpo humano às tecnologias",
          "que revolucionaram os diagnósticos e tratamentos,",
          "cada descoberta abriu caminho para uma medicina",
          "mais precisa, segura e eficaz."
        ],
        hologramType: "future"
      }
    ];

    let currentIndex = 0;

    function updateHologram(type) {
      const container = document.getElementById("hologram-stage");
      container.innerHTML = "";

      // Renderiza malhas geométricas brilhantes temáticas
      if (type === "egypt") {
        container.innerHTML = `
          <a-tetrahedron radius="0.45" color="#00f0ff" wireframe="true" position="0 0 0"
                         animation="property: rotation; to: 0 360 0; loop: true; dur: 8000; easing: linear"></a-tetrahedron>
          <a-octahedron radius="0.25" color="#ffd166" position="0 0 0"
                        animation="property: rotation; to: 360 0 0; loop: true; dur: 6000; easing: linear"></a-octahedron>
        `;
      } else if (type === "greece") {
        container.innerHTML = `
          <a-cylinder radius="0.08" height="0.8" color="#00f0ff" wireframe="true" position="0 0 0"></a-cylinder>
          <a-torus radius="0.3" radius-tubular="0.015" color="#7000ff" rotation="45 0 0"
                   animation="property: rotation; to: 405 360 0; loop: true; dur: 10000; easing: linear"></a-torus>
        `;
      } else if (type === "middle_ages") {
        container.innerHTML = `
          <a-box width="0.4" height="0.6" depth="0.1" color="#00f0ff" wireframe="true" position="0 0 0"
                 animation="property: rotation; to: 0 360 0; loop: true; dur: 9000; easing: linear"></a-box>
          <a-sphere radius="0.18" color="#ff007f" wireframe="true" position="0 0 0"></a-sphere>
        `;
      } else if (type === "renaissance") {
        container.innerHTML = `
          <a-sphere radius="0.35" color="#00f0ff" wireframe="true" segments-width="12" segments-height="12"
                    animation="property: rotation; to: 0 360 360; loop: true; dur: 12000; easing: linear"></a-sphere>
          <a-ring radius-inner="0.42" radius-outer="0.44" color="#ffea00" rotation="90 0 0"
                  animation="property: rotation; to: 90 360 0; loop: true; dur: 5000; easing: linear"></a-ring>
        `;
      } else if (type === "microscope") {
        container.innerHTML = `
          <a-torus-knot radius="0.25" radius-tubular="0.02" p="2" q="3" color="#00f0ff" wireframe="true"
                        animation="property: rotation; to: 360 360 0; loop: true; dur: 9000; easing: linear"></a-torus-knot>
        `;
      } else if (type === "industrial") {
        container.innerHTML = `
          <a-dodecahedron radius="0.38" color="#00ffcc" wireframe="true"
                          animation="property: rotation; to: 0 360 0; loop: true; dur: 7000; easing: linear"></a-dodecahedron>
          <a-sphere radius="0.12" color="#00f0ff" position="0 0 0"
                    animation="property: scale; to: 1.5 1.5 1.5; dir: alternate; loop: true; dur: 1000"></a-sphere>
        `;
      } else if (type === "dna") {
        container.innerHTML = `
          <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 6000; easing: linear">
            <a-sphere position="0.2 0.3 0" radius="0.08" color="#00f0ff"></a-sphere>
            <a-sphere position="-0.2 0.3 0" radius="0.08" color="#ff007f"></a-sphere>
            <a-cylinder position="0 0.3 0" rotation="0 0 90" radius="0.015" height="0.4" color="#fff"></a-cylinder>
            
            <a-sphere position="0 0 0.2" radius="0.08" color="#00f0ff"></a-sphere>
            <a-sphere position="0 0 -0.2" radius="0.08" color="#ff007f"></a-sphere>
            <a-cylinder position="0 0 0" rotation="90 0 0" radius="0.015" height="0.4" color="#fff"></a-cylinder>

            <a-sphere position="-0.2 -0.3 0" radius="0.08" color="#00f0ff"></a-sphere>
            <a-sphere position="0.2 -0.3 0" radius="0.08" color="#ff007f"></a-sphere>
            <a-cylinder position="0 -0.3 0" rotation="0 0 90" radius="0.015" height="0.4" color="#fff"></a-cylinder>
          </a-entity>
        `;
      } else {
        container.innerHTML = `
          <a-sphere radius="0.35" color="#00f0ff" wireframe="true"
                    animation="property: rotation; to: 360 360 360; loop: true; dur: 5000; easing: linear"></a-sphere>
          <a-sphere radius="0.1" color="#ffffff"
                    animation="property: scale; to: 2 2 2; dir: alternate; loop: true; dur: 800"></a-sphere>
        `;
      }
    }

    function renderCard(index) {
      const data = timelineData[index];
      document.getElementById("card-title").setAttribute("value", `${data.epoca} [${data.periodo}]`);
      document.getElementById("card-subtitle").setAttribute("value", data.subtitulo);
      document.getElementById("card-content").setAttribute("value", data.topicos.join("\n\n"));
      document.getElementById("step-indicator").setAttribute("value", `REGISTRO: 0${index + 1} // 0${timelineData.length}`);

      updateHologram(data.hologramType);

      // Atualiza nós da mini-timeline
      for (let i = 0; i < timelineData.length; i++) {
        const node = document.getElementById(`node-${i}`);
        if (node) {
          if (i === index) {
            node.setAttribute("color", "#00f0ff");
            node.setAttribute("scale", "1.4 1.4 1.4");
          } else {
            node.setAttribute("color", "#3a506b");
            node.setAttribute("scale", "1 1 1");
          }
        }
      }
    }

    // Componente de botão interativo futurista
    AFRAME.registerComponent('cyber-button', {
      schema: { action: { type: 'string' }, targetIndex: { type: 'int', default: -1 } },
      init: function () {
        const el = this.el;
        const data = this.data;

        el.addEventListener('mouseenter', () => {
          playSciFiSound('hover');
          el.setAttribute('material', 'color', '#00f0ff');
          el.setAttribute('material', 'opacity', '0.9');
        });

        el.addEventListener('mouseleave', () => {
          el.setAttribute('material', 'color', '#0b132b');
          el.setAttribute('material', 'opacity', '0.6');
        });

        el.addEventListener('click', () => {
          playSciFiSound('click');
          if (data.action === 'next' && currentIndex < timelineData.length - 1) {
            currentIndex++;
            renderCard(currentIndex);
          } else if (data.action === 'prev' && currentIndex > 0) {
            currentIndex--;
            renderCard(currentIndex);
          } else if (data.action === 'jump') {
            currentIndex = data.targetIndex;
            renderCard(currentIndex);
          }
        });
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      // Criação dinâmica da mini-timeline no rodapé do terminal
      const bar = document.getElementById("timeline-mini-bar");
      const total = timelineData.length;
      const startX = -1.2;
      const step = 2.4 / (total - 1);

      for (let i = 0; i < total; i++) {
        const node = document.createElement("a-sphere");
        node.setAttribute("id", `node-${i}`);
        node.setAttribute("class", "clickable");
        node.setAttribute("radius", "0.04");
        node.setAttribute("color", "#3a506b");
        node.setAttribute("position", `${startX + (i * step)} 0 0.04`);
        node.setAttribute("cyber-button", `action: jump; targetIndex: ${i}`);
        bar.appendChild(node);
      }

      renderCard(0);
    });
  </script>
</head>
<body>
  <a-scene environment="preset: starry; ground: canyon; groundColor: #050510; groundColor2: #020205; skyType: atmosphere; skyColor: #02010a; horizonColor: #0b1a30; dressing: apparatus; dressingAmount: 18; dressingColor: #00f0ff"
           cursor="rayOrigin: mouse"
           raycaster="objects: .clickable">

    <!-- RIG DO USUÁRIO & RASTREAMENTO AVANÇADO DE MÃOS NO QUEST 3 -->
    <a-entity id="rig" position="0 1.6 0">
      <a-camera id="camera" look-controls wasd-controls position="0 0 0">
        <!-- Retículo cibernético para fallback com olhar -->
        <a-ring radius-inner="0.008" radius-outer="0.014" color="#00f0ff"
                position="0 0 -1" material="shader: flat; opacity: 0.6"></a-ring>
      </a-camera>

      <!-- Mão Esquerda (Laser + Pinch) -->
      <a-entity hand-tracking-controls="hand: left"
                laser-controls="hand: left"
                raycaster="objects: .clickable; lineColor: #00f0ff; lineOpacity: 0.9">
      </a-entity>

      <!-- Mão Direita (Laser + Pinch) -->
      <a-entity hand-tracking-controls="hand: right"
                laser-controls="hand: right"
                raycaster="objects: .clickable; lineColor: #ff007f; lineOpacity: 0.9">
      </a-entity>
    </a-entity>

    <!-- ANÉIS HOLOGRÁFICOS GIROSCÓPICOS AO REDOR DO AMBIENTE -->
    <a-entity position="0 1.6 -3.2">
      <a-torus radius="2.4" radius-tubular="0.008" color="#00f0ff" opacity="0.3" rotation="20 45 0"
               animation="property: rotation; to: 20 405 0; loop: true; dur: 45000; easing: linear"></a-torus>
      <a-torus radius="2.6" radius-tubular="0.006" color="#7000ff" opacity="0.25" rotation="-30 10 0"
               animation="property: rotation; to: -30 -350 0; loop: true; dur: 55000; easing: linear"></a-torus>
    </a-entity>

    <!-- ESTAÇÃO HOLOGRÁFICA PRINCIPAL (HUD Sci-Fi) -->
    <a-entity id="terminal" position="0 1.6 -3.0">

      <!-- Fundo Holográfico Translúcido -->
      <a-plane width="4.2" height="2.5" color="#03071e"
               material="opacity: 0.85; transparent: true; roughness: 0.1; metalness: 0.8"
               position="0 0 0"></a-plane>

      <!-- Moldura Externa de Neon Ciano -->
      <a-plane width="4.24" height="0.015" color="#00f0ff" position="0 1.25 0.01"></a-plane>
      <a-plane width="4.24" height="0.015" color="#00f0ff" position="0 -1.25 0.01"></a-plane>
      <a-plane width="0.015" height="2.5" color="#00f0ff" position="-2.12 0 0.01"></a-plane>
      <a-plane width="0.015" height="2.5" color="#00f0ff" position="2.12 0 0.01"></a-plane>

      <!-- Linha de Scanline Superior -->
      <a-plane width="4.1" height="0.003" color="#7000ff" position="0 1.05 0.02"></a-plane>

      <!-- Cabeçalho do HUD -->
      <a-text value="MED-CORP // ARCHIVAL INTERFACE v4.0" align="left" width="3.4" color="#00f0ff"
              position="-1.9 1.14 0.03" font="monoid"></a-text>

      <a-text id="step-indicator" value="REGISTRO: 01 // 08" align="right" width="3.4" color="#00f0ff"
              position="1.9 1.14 0.03" font="monoid"></a-text>

      <!-- COLUNA DA ESQUERDA: Textos e Diagnósticos Históricos -->
      <a-text id="card-title" value="" align="left" width="3.6" color="#ffffff"
              position="-1.9 0.82 0.03" font="kelsonsans"></a-text>

      <a-text id="card-subtitle" value="" align="left" width="2.8" color="#00f0ff"
              position="-1.9 0.62 0.03" font="monoid"></a-text>

      <a-text id="card-content" value="" align="left" width="2.6" color="#e0e1dd"
              position="-1.9 0.40 0.03" font="monoid" baseline="top" wrap-count="36" line-height="52"></a-text>

      <!-- COLUNA DA DIREITA: Pedestal do Artefato 3D -->
      <a-entity position="1.1 0.1 0">
        <!-- Plataforma do Holograma -->
        <a-cylinder radius="0.55" height="0.04" color="#00f0ff" material="wireframe: true" position="0 -0.5 0"></a-cylinder>
        <a-ring radius-inner="0.6" radius-outer="0.62" color="#7000ff" rotation="-90 0 0" position="0 -0.49 0"></a-ring>
        
        <!-- Recipiente dinâmico dos artefatos -->
        <a-entity id="hologram-stage" position="0 0 0"></a-entity>
      </a-entity>

      <!-- LINHA DO TEMPO RÁPIDA (Trilho no rodapé) -->
      <a-entity id="timeline-mini-bar" position="0 -0.75 0">
        <a-plane width="2.5" height="0.005" color="#1f4068" position="0 0 0.02"></a-plane>
      </a-entity>

      <!-- BOTÕES HOLOGRÁFICOS INFERIORES -->
      <a-plane id="btn-prev" class="clickable" cyber-button="action: prev"
               width="0.85" height="0.22" color="#0b132b" position="-1.2 -1.02 0.04"
               material="opacity: 0.6; transparent: true">
        <a-plane width="0.85" height="0.01" color="#00f0ff" position="0 0.11 0.01"></a-plane>
        <a-text value="<<< VOLTAR" align="center" width="2.4" color="#00f0ff" font="monoid" position="0 0 0.02"></a-text>
      </a-plane>

      <a-plane id="btn-next" class="clickable" cyber-button="action: next"
               width="0.85" height="0.22" color="#0b132b" position="1.2 -1.02 0.04"
               material="opacity: 0.6; transparent: true">
        <a-plane width="0.85" height="0.01" color="#00f0ff" position="0 0.11 0.01"></a-plane>
        <a-text value="AVANÇAR >>>" align="center" width="2.4" color="#00f0ff" font="monoid" position="0 0 0.02"></a-text>
      </a-plane>

    </a-entity>

    <!-- ILUMINAÇÃO CYBERPUNK -->
    <a-light type="ambient" color="#060919" intensity="2.0"></a-light>
    <a-light type="point" color="#00f0ff" intensity="1.5" position="1.2 2.0 -2.0"></a-light>
    <a-light type="point" color="#7000ff" intensity="1.2" position="-1.5 1.0 -2.0"></a-light>

  </a-scene>
</body>
</html>
