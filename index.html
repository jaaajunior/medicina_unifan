    * { box-sizing: border-box; user-select: none; -webkit-user-select: none; }

    html, body {
      margin: 0; padding: 0; width: 100%; height: 100%; overflow: hidden;
      background-color: #030712;
      font-family: 'Plus Jakarta Sans', sans-serif;
      color: #f8fafc;
    }

    .font-mono-tech { font-family: 'JetBrains Mono', monospace; }

    .glass-dock {
      background: rgba(10, 17, 32, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 240, 255, 0.25);

      background: linear-gradient(135deg, rgba(0, 240, 255, 0.4) 0%, rgba(14, 165, 233, 0.25) 100%) !important;
      color: #ffffff !important;
      box-shadow: 0 0 12px rgba(0, 240, 255, 0.35) !important;
    }

    .hud-transition { transition: opacity 0.3s ease, transform 0.3s ease; }
    .hud-hidden { opacity: 0; pointer-events: none !important; transform: translateY(-20px); }

  <!-- ÁUDIO -->
  <script>
    let audioCtx = null;
    let isEcgAudioActive = true;

    function initAudio() {
      try {
        if (!audioCtx) {
          const AudioContextClass = window.AudioContext || window.webkitAudioContext;
          if (AudioContextClass) audioCtx = new AudioContextClass();
        }
        if (audioCtx && audioCtx.state === 'suspended') audioCtx.resume();
      } catch (e) {
        console.warn('Audio silent fail:', e);
      }
    }

    function playBeep(freq = 880) {
      if (!audioCtx || !isEcgAudioActive) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, now);
        osc.frequency.exponentialRampToValueAtTime(freq * 1.05, now + 0.07);
        gain.gain.setValueAtTime(0.02, now);
        gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.08);
        osc.start(now);
        osc.stop(now + 0.08);
      } catch (e) {}
    }

    function playToolSound(tool) {
      initAudio();
      if (!audioCtx) return;
      try {
        const now = audioCtx.currentTime;
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain);
        gain.connect(audioCtx.destination);

        if (tool === 'scalpel') {
          osc.type = 'sawtooth';
          osc.frequency.setValueAtTime(1100, now);
          osc.frequency.exponentialRampToValueAtTime(550, now + 0.16);
          gain.gain.setValueAtTime(0.04, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.16);
          osc.start(now); osc.stop(now + 0.16);
        } else if (tool === 'cautery') {
          osc.type = 'square';
          osc.frequency.setValueAtTime(240, now);
          osc.frequency.linearRampToValueAtTime(310, now + 0.2);
          gain.gain.setValueAtTime(0.05, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.2);
          osc.start(now); osc.stop(now + 0.2);
        } else if (tool === 'suction') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(320, now);
          osc.frequency.linearRampToValueAtTime(160, now + 0.25);
          gain.gain.setValueAtTime(0.04, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.25);
          osc.start(now); osc.stop(now + 0.25);
        } else if (tool === 'laser') {
          osc.type = 'sine';
          osc.frequency.setValueAtTime(2200, now);
          osc.frequency.exponentialRampToValueAtTime(450, now + 0.14);
          gain.gain.setValueAtTime(0.05, now);
          gain.gain.exponentialRampToValueAtTime(0.0001, now + 0.14);
          osc.start(now); osc.stop(now + 0.14);
        }
      } catch (e) {}
    }

    function toggleEcgAudio() {
      initAudio();
      isEcgAudioActive = !isEcgAudioActive;
      const btn = document.getElementById('btn-ecg-audio');
      if (btn) {
        btn.textContent = isEcgAudioActive ? '🔊' : '🔇';
        btn.className = isEcgAudioActive ? 'btn-spatial p-2 rounded-xl text-emerald-400' : 'btn-spatial p-2 rounded-xl text-gray-500';
      }
    }

    setInterval(() => { playBeep(880); }, 850);
    window.addEventListener('click', () => { initAudio(); }, { once: true });
  </script>

  <!-- WEBXR HELPER -->
  <script>
    const VRButtonHelper = {
      createButton: function (renderer) {
        const button = document.createElement('button');

        function showEnterVR() {
          let currentSession = null;

          async function onSessionStarted(session) {
            session.addEventListener('end', onSessionEnded);
            await renderer.xr.setSession(session);
            button.textContent = 'SAIR DO VR';
            currentSession = session;
          }

          function onSessionEnded() {
            currentSession.removeEventListener('end', onSessionEnded);
            button.textContent = 'ENTRAR EM VR';
            currentSession = null;
          }

          button.style.display = '';
          button.style.cursor = 'pointer';
          button.textContent = 'ENTRAR EM VR';

          button.onclick = function () {
            if (currentSession === null) {
              const sessionInit = { optionalFeatures: ['local-floor', 'bounded-floor', 'hand-tracking'] };
              navigator.xr.requestSession('immersive-vr', sessionInit).then(onSessionStarted).catch(function (err) {
                console.warn('Falha WebXR:', err);
              });
            } else {
              currentSession.end();
            }
          };
        }

        function disableButton() {
          button.style.display = '';
          button.style.cursor = 'auto';
          button.textContent = 'VR PRONTO NO QUEST';
          button.style.opacity = '0.7';
          button.onclick = null;
        }

        button.className = "px-3 py-1.5 rounded-xl bg-gradient-to-r from-cyan-500 to-sky-600 text-black font-mono-tech font-bold text-xs shadow-lg shadow-cyan-500/20 active:scale-95";

        if ('xr' in navigator) {
          navigator.xr.isSessionSupported('immersive-vr').then(function (supported) {
            supported ? showEnterVR() : disableButton();
          }).catch(disableButton);
        } else {
          disableButton();
        }

        return button;
      }
    };
  </script>

  <!-- NÚCLEO 3D -->
  <script>
    let scene, camera, renderer, controls;
    let clock = new THREE.Clock();

    let surgicalFieldGroup, craniGroup, brainTumorMesh, craniotomyRingMesh, tool3DMesh;
    let telemetryBoardGroup, telemetryCanvas, telemetryCtx, telemetryTexture;
    let videoTheaterGroup, videoTexture, videoElement, videoScreenMesh;
    let patientChestGroup;
    let currentTool = 'scalpel';
    let tumorHealth = 100;

    let raycaster = new THREE.Raycaster();
    let mouse = new THREE.Vector2();

    // Geometria base do paciente (deitado de costas sobre a mesa)
    // Eixo Z = eixo longitudinal (cabeça em +Z, pés em -Z). Y = para cima.
    const TABLE_TOP_Y = 1.04;
    const HEAD_Y = 1.20;
    const HEAD_Z = 0.36;

    // Ponto de craniotomia (região frontal)
    const CRANI_POS = new THREE.Vector3(0, 1.341, 0.482);
    const CRANI_TILT = 0.655; // inclinação seguindo a curvatura da testa
    const craniAnchor = CRANI_POS.clone(); // ponto atual da craniotomia (muda se a cabeça realista carregar)

    let headRoot = null, headLocal = null, primitiveFaceParts = [], realHead = null;
    let toolEnvMap = null, toolFlashUntil = 0;

    function setupORLighting() {
      scene.add(new THREE.AmbientLight(0x3a4a66, 0.7));

      const surgicalLight = new THREE.SpotLight(0xfff5ea, 1.6);
      surgicalLight.position.set(0.1, 3.2, 0.4);
      surgicalLight.target.position.set(0, 1.15, 0.2);
      surgicalLight.angle = Math.PI / 4.5;
      surgicalLight.penumbra = 0.35;
      scene.add(surgicalLight);
      scene.add(surgicalLight.target);

      const dirLight = new THREE.DirectionalLight(0xe2e8f0, 0.6);
      dirLight.position.set(2, 5, 2);
      scene.add(dirLight);

      const rimLight = new THREE.DirectionalLight(0x0ea5e9, 0.35);
      rimLight.position.set(-3, 3, -3);
      scene.add(rimLight);

      const theaterPoint = new THREE.PointLight(0x00f0ff, 0.6, 8);
      theaterPoint.position.set(2.4, 2.0, -0.6);
      scene.add(theaterPoint);

      const monitorPoint = new THREE.PointLight(0x10b981, 0.6, 8);
      monitorPoint.position.set(-2.4, 2.0, -0.6);
      scene.add(monitorPoint);
    }

    function buildArchitecturalRoom() {
      const floor = new THREE.Mesh(
        new THREE.PlaneGeometry(16, 16),
        new THREE.MeshStandardMaterial({ color: 0x071120, roughness: 0.3, metalness: 0.2 })
      );
      floor.rotation.x = -Math.PI / 2;
      scene.add(floor);

      const grid = new THREE.GridHelper(16, 32, 0x0284c7, 0x1e293b);
      grid.position.y = 0.005;
      scene.add(grid);

      const scialytic = new THREE.Mesh(
        new THREE.CylinderGeometry(0.5, 0.6, 0.1, 32),
        new THREE.MeshStandardMaterial({ color: 0x64748b, metalness: 0.8, roughness: 0.2 })
      );
      scialytic.position.set(0.1, 3.2, 0.4);
      scene.add(scialytic);
    }

    // Helper: elipsoide (esfera escalada)
    function ellipsoid(sx, sy, sz, mat, x, y, z) {
      const m = new THREE.Mesh(new THREE.SphereGeometry(1, 32, 24), mat);
      m.scale.set(sx, sy, sz);
      m.position.set(x, y, z);
      return m;
    }

    // Cabeça: construída com o rosto virado para +Z local, depois rotacionada
    // para ficar com o rosto para CIMA (+Y) e o topo da cabeça apontando para +Z.
    function buildPatientHead() {
      headRoot = new THREE.Group();
      headRoot.position.set(0, HEAD_Y, HEAD_Z);

      const outer = new THREE.Group();
      outer.rotation.z = Math.PI;
      const headGroup = new THREE.Group();
      headGroup.rotation.x = Math.PI / 2;
      outer.add(headGroup);
      headRoot.add(outer);

      const skinMat = new THREE.MeshStandardMaterial({ color: 0xc99a7e, roughness: 0.6, metalness: 0.05 });

      const skull = new THREE.Mesh(new THREE.SphereGeometry(0.165, 32, 32), skinMat);
      skull.scale.set(0.85, 1.05, 0.98);
      headGroup.add(skull);

      const jaw = new THREE.Mesh(new THREE.BoxGeometry(0.12, 0.09, 0.12), skinMat);
      jaw.position.set(0, -0.07, 0.07);
      headGroup.add(jaw);

      const chin = new THREE.Mesh(new THREE.SphereGeometry(0.04, 16, 16), skinMat);
      chin.position.set(0, -0.095, 0.13);
      headGroup.add(chin);

      [-1, 1].forEach(s => {
        const cheek = new THREE.Mesh(new THREE.SphereGeometry(0.045, 16, 16), skinMat);
        cheek.position.set(0.065 * s, -0.01, 0.1);
        headGroup.add(cheek);
      });

      const noseBridge = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.015, 0.075, 12), skinMat);
      noseBridge.rotation.x = 0.25;
      noseBridge.position.set(0, 0.005, 0.16);
      headGroup.add(noseBridge);

      const noseTip = new THREE.Mesh(new THREE.SphereGeometry(0.014, 12, 12), skinMat);
      noseTip.position.set(0, -0.025, 0.175);
      headGroup.add(noseTip);

      const eyelidMat = new THREE.MeshStandardMaterial({ color: 0xca9d83, roughness: 0.7 });
      const eyelidGeo = new THREE.TorusGeometry(0.02, 0.004, 10, 20, Math.PI);
      [-1, 1].forEach(s => {
        const eyelid = new THREE.Mesh(eyelidGeo, eyelidMat);
        eyelid.rotation.x = Math.PI / 2.2;
        eyelid.position.set(0.05 * s, 0.035, 0.145);
        headGroup.add(eyelid);
      });

      const lipMat = new THREE.MeshStandardMaterial({ color: 0xc27a6f, roughness: 0.55 });
      const lips = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.045, 12), lipMat);
      lips.rotation.z = Math.PI / 2;
      lips.position.set(0, -0.062, 0.148);
      headGroup.add(lips);

      const earGeo = new THREE.TorusGeometry(0.028, 0.007, 8, 16, Math.PI * 1.2);
      const earL = new THREE.Mesh(earGeo, skinMat);
      earL.rotation.y = -Math.PI / 2;
      earL.position.set(-0.145, 0, 0);
      headGroup.add(earL);
      const earR = new THREE.Mesh(earGeo, skinMat);
      earR.rotation.y = Math.PI / 2;
      earR.position.set(0.145, 0, 0);
      headGroup.add(earR);

      // Tubo orotraqueal saindo da boca em direção ao tórax/ventilador
      const tubeMat = new THREE.MeshStandardMaterial({ color: 0xf8fafc, roughness: 0.2, transparent: true, opacity: 0.85 });
      const tube = new THREE.Mesh(new THREE.CylinderGeometry(0.008, 0.008, 0.28, 16), tubeMat);
      tube.rotation.x = Math.PI - 0.64;
      tube.position.set(0, -0.174, 0.234);
      headGroup.add(tube);

      const tape = new THREE.Mesh(new THREE.BoxGeometry(0.07, 0.015, 0.01), new THREE.MeshStandardMaterial({ color: 0xfef08a, roughness: 0.7 }));
      tape.position.set(0.01, -0.062, 0.156);
      headGroup.add(tape);

      // Guarda as peças da cabeça simples (para esconder se a cabeça realista carregar)
      primitiveFaceParts = headGroup.children.slice();
      headLocal = headGroup;

      // Fixador de Mayfield
      const titaniumMat = new THREE.MeshStandardMaterial({ color: 0xa1a1aa, metalness: 0.9, roughness: 0.2 });
      const clampArc = new THREE.Mesh(new THREE.TorusGeometry(0.24, 0.016, 16, 32, Math.PI * 1.2), titaniumMat);
      clampArc.rotation.x = Math.PI / 2;
      clampArc.rotation.z = -Math.PI * 0.1;
      clampArc.position.set(0, -0.01, -0.02);
      headGroup.add(clampArc);

      const pinL = new THREE.Mesh(new THREE.CylinderGeometry(0.005, 0.008, 0.05, 12), titaniumMat);
      pinL.rotation.z = Math.PI / 3;
      pinL.position.set(-0.16, 0.04, -0.01);
      headGroup.add(pinL);
      const pinR = new THREE.Mesh(new THREE.CylinderGeometry(0.005, 0.008, 0.05, 12), titaniumMat);
      pinR.rotation.z = -Math.PI / 3;
      pinR.position.set(0.16, 0.04, -0.01);
      headGroup.add(pinR);

      return headRoot;
    }

    // Corpo coberto por UM lençol cirúrgico contínuo (malha deformada no formato do paciente)
    let sheetMesh = null, sheetBase = null, sheetBreath = [];

    function smooth01(a, b, v) {
      const t = Math.min(1, Math.max(0, (v - a) / (b - a)));
      return t * t * (3 - 2 * t);
    }

    function sheetProfile(arr, z) {
      if (z >= arr[0][0]) return [arr[0][1], arr[0][2]];
      for (let k = 1; k < arr.length; k++) {
        if (z >= arr[k][0]) {
          const t = smooth01(arr[k - 1][0], arr[k][0], z);
          return [
            arr[k - 1][1] + (arr[k][1] - arr[k - 1][1]) * t,
            arr[k - 1][2] + (arr[k][2] - arr[k - 1][2]) * t
          ];
        }
      }
      const L = arr[arr.length - 1];
      return [L[1], L[2]];
    }

    // [z, altura, meia-largura] da cabeceira para os pés
    const SHEET_TORSO = [[0.18, 0.15, 0.30], [0.08, 0.13, 0.28], [-0.2, 0.09, 0.24], [-0.45, 0.078, 0.21], [-0.62, 0.092, 0.22], [-0.85, 0.09, 0.2]];
    const SHEET_LEG   = [[-0.6, 0.085, 0.1], [-0.9, 0.088, 0.088], [-1.25, 0.072, 0.076], [-1.55, 0.064, 0.066], [-1.78, 0.105, 0.072], [-1.9, 0.085, 0.06]];

    function sheetCap(r) { return r >= 1 ? 0 : Math.pow(1 - r * r, 0.55); }

    function sheetSurface(x, z) {
      const ax = Math.abs(x);
      const pt = sheetProfile(SHEET_TORSO, z);
      let h = pt[0] * sheetCap(ax / pt[1]);

      const pl = sheetProfile(SHEET_LEG, z);
      const hl = Math.max(pl[0] * sheetCap(Math.abs(x - 0.095) / pl[1]), pl[0] * sheetCap(Math.abs(x + 0.095) / pl[1]));
      const tb = smooth01(-0.62, -0.85, z);
      h = h * (1 - tb) + hl * tb;

      // braços ao lado do corpo, sob o lençol
      const armEdge = smooth01(0.12, 0.04, z) * smooth01(-0.62, -0.5, z);
      h = Math.max(h, 0.05 * sheetCap(Math.abs(ax - 0.31) / 0.052) * armEdge);

      // dobras suaves do tecido
      h += 0.0022 * Math.sin(z * 38 + ax * 11) * Math.min(1, h * 28);
      h += 0.0015 * Math.sin(z * 71 - ax * 23 + 1.3) * Math.min(1, h * 28);
      return h;
    }

    function buildPatientBody() {
      const bodyGroup = new THREE.Group();
      const NX = 96, NZ = 220, Z0 = 0.18, Z1 = -1.95;
      const HALF = 0.43; // meia-largura do colchão

      const geo = new THREE.PlaneGeometry(1, 1, NX, NZ);
      const pos = geo.attributes.position;
      sheetBase = new Float32Array(pos.count * 3);
      sheetBreath = [];

      for (let iz = 0; iz <= NZ; iz++) {
        const z = Z0 + (Z1 - Z0) * (iz / NZ);
        for (let ix = 0; ix <= NX; ix++) {
          const i = iz * (NX + 1) + ix;
          const p = -1 + 2 * ix / NX;          // -1..1
          const sgn = p < 0 ? -1 : 1;
          const ap = Math.abs(p);
          let x, y;
          if (ap <= 0.8) {
            x = sgn * (ap / 0.8) * HALF;
            y = TABLE_TOP_Y + 0.004 + sheetSurface(x, z);
          } else {
            // caimento lateral do lençol pela borda da mesa
            const t = (ap - 0.8) / 0.2;
            x = sgn * (HALF + 0.004 + 0.035 * t);
            y = TABLE_TOP_Y + 0.004 - 0.34 * Math.pow(t, 0.8);
          }
          // caimento na extremidade dos pés
          if (z < -1.86) y -= Math.min((-1.86 - z) * 6, 0.35);

          pos.setXYZ(i, x, y, z);
          sheetBase[i * 3] = x; sheetBase[i * 3 + 1] = y; sheetBase[i * 3 + 2] = z;

          const w = (y > TABLE_TOP_Y + 0.02) ? smooth01(0.12, 0.0, z) * smooth01(-0.45, -0.2, z) : 0;
          if (w > 0.001) sheetBreath.push([i, w]);
        }
      }
      geo.computeVertexNormals();

      sheetMesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
        color: 0x2f86c0, roughness: 0.92, metalness: 0.0, side: THREE.DoubleSide
      }));
      bodyGroup.add(sheetMesh);
      return bodyGroup;
    }

    function updateSheetBreath(time) {
      if (!sheetMesh || !sheetBreath.length) return;
      const pos = sheetMesh.geometry.attributes.position;
      const b = Math.sin(time * 1.5) * 0.006;
      for (let k = 0; k < sheetBreath.length; k++) {
        const i = sheetBreath[k][0];
        pos.setY(i, sheetBase[i * 3 + 1] + b * sheetBreath[k][1]);
      }
      pos.needsUpdate = true;
    }

    function buildCentralSurgicalField() {

      surgicalFieldGroup.add(buildPatientHead());

      // ===== Janela de craniotomia (grupo inclinado seguindo a testa) =====

      const boneMat = new THREE.MeshStandardMaterial({ color: 0xfbf1d8, roughness: 0.45, metalness: 0.05 });

      craniotomyRingMesh = new THREE.Mesh(

      cortexMesh.position.y = -0.021;

      brainTumorMesh = new THREE.Mesh(
        new THREE.DodecahedronGeometry(0.028, 2),

      );

    // ===== Instrumentos cirúrgicos (modelos procedurais detalhados) =====
    // Convenção: ponta do instrumento em y = TIP_Y, cabo para +y.
    const TIP_Y = -0.155;

    function buildToolEnvMap() {
      try {
        const envScene = new THREE.Scene();
        envScene.background = new THREE.Color(0x6b7686);
        const panel = (w, h, p, color) => {
          const m = new THREE.Mesh(new THREE.PlaneGeometry(w, h), new THREE.MeshBasicMaterial({ color, side: THREE.DoubleSide }));
          m.position.set(p[0], p[1], p[2]);
          m.lookAt(0, 0, 0);
          envScene.add(m);
        };
        panel(6, 6, [0, 5, 0], 0xffffff);
        panel(4, 6, [5, 2, 2], 0xdfe9ff);
        panel(4, 6, [-5, 2, -2], 0xfff1dd);
        panel(8, 3, [0, 1, -6], 0xb8d4ff);
        panel(8, 2, [0, -4, 0], 0x2a3342);
        const pm = new THREE.PMREMGenerator(renderer);
        toolEnvMap = pm.fromScene(envScene, 0.03).texture;
        pm.dispose();
      } catch (e) {
        console.warn('Sem mapa de reflexo para instrumentos:', e);
        toolEnvMap = null;
      }
    }

    function toolMat(color, metalness, roughness, extra) {
      const m = new THREE.MeshStandardMaterial(Object.assign({ color, metalness, roughness }, extra || {}));
      if (toolEnvMap) { m.envMap = toolEnvMap; m.envMapIntensity = 1.1; }
      return m;
    }

    function glowMat(color, opacity) {
      return new THREE.MeshBasicMaterial({
        color, transparent: true, opacity: opacity === undefined ? 0.8 : opacity,
        blending: THREE.AdditiveBlending, depthWrite: false
      });
    }

    function latheMesh(profile, mat, seg) {
      mat.side = THREE.DoubleSide;
      return new THREE.Mesh(new THREE.LatheGeometry(profile.map(p => new THREE.Vector2(p[0], p[1])), seg || 32), mat);
    }

    function tubeMesh(points, radius, mat, seg) {
      const curve = new THREE.CatmullRomCurve3(points.map(p => new THREE.Vector3(p[0], p[1], p[2])));
      return new THREE.Mesh(new THREE.TubeGeometry(curve, seg || 40, radius, 10, false), mat);
    }

    function ringMesh(radius, tubeR, y, mat) {
      const r = new THREE.Mesh(new THREE.TorusGeometry(radius, tubeR, 10, 32), mat);
      r.rotation.x = Math.PI / 2;
      r.position.y = y;
      return r;
    }

    function addGlow(g, glows, color, radius, opacity, x, y, z) {
      const m = new THREE.Mesh(new THREE.SphereGeometry(radius, 16, 12), glowMat(color, opacity));
      m.position.set(x, y, z);
      g.add(m);
      glows.push(m);
      return m;
    }

    // Bisturi de plasma: caneta eletrocirúrgica com eletrodo fino e arco de plasma
    function buildScalpel(g, glows) {
      const white = toolMat(0xe8edf2, 0.1, 0.35);
      const steel = toolMat(0xd5dbe3, 0.95, 0.2);
      const dark = toolMat(0x1b2028, 0.3, 0.55);
      const rubber = toolMat(0x111418, 0.0, 0.85);

      const blade = new THREE.Mesh(new THREE.BoxGeometry(0.0012, 0.026, 0.0055), steel);
      blade.position.y = TIP_Y + 0.016;
      g.add(blade);
      const edge = new THREE.Mesh(new THREE.ConeGeometry(0.0006, 0.004, 8), steel);
      edge.rotation.x = Math.PI;
      edge.position.y = TIP_Y + 0.002;
      g.add(edge);

      g.add(latheMesh([
        [0.0016, -0.128], [0.0042, -0.121], [0.0072, -0.105], [0.0086, -0.08], [0.0092, -0.03],
        [0.0092, 0.02], [0.0084, 0.05], [0.006, 0.064], [0.0035, 0.068]
      ], white));

      for (let k = 0; k < 6; k++) g.add(ringMesh(0.0089, 0.0004, -0.095 + k * 0.009, dark));

      const btnBlue = new THREE.Mesh(new THREE.BoxGeometry(0.005, 0.009, 0.002), toolMat(0x2563eb, 0.1, 0.4));
      btnBlue.position.set(0, -0.012, 0.0094);
      g.add(btnBlue);
      const btnYellow = new THREE.Mesh(new THREE.BoxGeometry(0.005, 0.009, 0.002), toolMat(0xfacc15, 0.1, 0.4));
      btnYellow.position.set(0, 0.008, 0.0094);
      g.add(btnYellow);

      g.add(tubeMesh([[0, 0.066, 0], [0.004, 0.09, 0.004], [0.025, 0.12, 0.012], [0.06, 0.12, 0], [0.1, 0.1, -0.02]], 0.0022, rubber, 50));

      addGlow(g, glows, 0x00f0ff, 0.0035, 0.8, 0, TIP_Y, 0);
      addGlow(g, glows, 0x38bdf8, 0.008, 0.25, 0, TIP_Y, 0);
    }

    // Cautério: pinça bipolar baionetada com cabos isolados
    function buildCautery(g, glows) {
      const steel = toolMat(0xd5dbe3, 0.95, 0.22);
      const insul = toolMat(0x1f3b57, 0.15, 0.5);
      const dark = toolMat(0x2a2f38, 0.4, 0.5);
      const rubber = toolMat(0x111418, 0.0, 0.85);

      [-1, 1].forEach(s => {
        const pts = [
          [s * 0.0075, 0.085, -0.012], [s * 0.0065, 0.03, -0.012], [s * 0.0045, -0.01, -0.005],
          [s * 0.0035, -0.07, 0], [s * 0.0013, -0.14, 0], [s * 0.0007, TIP_Y, 0]
        ];
        const curve = new THREE.CatmullRomCurve3(pts.map(p => new THREE.Vector3(p[0], p[1], p[2])));
        g.add(new THREE.Mesh(new THREE.TubeGeometry(curve, 60, 0.0017, 10, false), steel));
        const dense = curve.getPoints(80).slice(0, 46);
        g.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(dense), 50, 0.0026, 10, false), insul));
        addGlow(g, glows, 0xf59e0b, 0.0022, 0.85, s * 0.0007, TIP_Y, 0);
      });

      const block = new THREE.Mesh(new THREE.BoxGeometry(0.02, 0.012, 0.012), dark);
      block.position.set(0, 0.092, -0.012);
      g.add(block);
      g.add(tubeMesh([[0, 0.098, -0.012], [0.005, 0.12, -0.016], [0.03, 0.14, -0.01], [0.07, 0.13, 0.0]], 0.0022, rubber, 40));
    }

    // Aspirador ultrassônico (CUSA): peça de mão, ponta tubular, irrigação e aspiração
    function buildSuction(g, glows) {
      const ti = toolMat(0xb9c2cc, 0.9, 0.28);
      const steel = toolMat(0xd5dbe3, 0.95, 0.2);
      const dark = toolMat(0x1b2028, 0.3, 0.55);
      const gray = toolMat(0x4b5563, 0.1, 0.7);

      g.add(latheMesh([
        [0.0036, -0.092], [0.0062, -0.084], [0.0105, -0.062], [0.0122, -0.03], [0.0125, 0],
        [0.0125, 0.06], [0.0108, 0.074], [0.006, 0.08], [0.004, 0.082]
      ], ti));
      g.add(ringMesh(0.0127, 0.0012, 0.012, toolMat(0x14b8a6, 0.3, 0.4)));
      g.add(ringMesh(0.0127, 0.0010, 0.045, dark));

      const tipTube = new THREE.Mesh(new THREE.CylinderGeometry(0.0034, 0.0034, 0.066, 24, 1, true), toolMat(0xc7cdd6, 0.9, 0.25, { side: THREE.DoubleSide }));
      tipTube.position.y = TIP_Y + 0.033;
      g.add(tipTube);
      g.add(ringMesh(0.0034, 0.0006, TIP_Y, steel));
      const bore = new THREE.Mesh(new THREE.CylinderGeometry(0.0027, 0.0027, 0.04, 16, 1, true),
        new THREE.MeshBasicMaterial({ color: 0x06080b, side: THREE.BackSide }));
      bore.position.y = TIP_Y + 0.02;
      g.add(bore);

      const flue = new THREE.Mesh(new THREE.CylinderGeometry(0.0052, 0.0052, 0.03, 24, 1, true),
        new THREE.MeshStandardMaterial({ color: 0x5eead4, transparent: true, opacity: 0.35, roughness: 0.2, side: THREE.DoubleSide }));
      flue.position.y = -0.105;
      g.add(flue);

      g.add(tubeMesh([[0.010, 0.0, 0.004], [0.022, 0.02, 0.012], [0.04, 0.05, 0.025], [0.07, 0.07, 0.02]], 0.0022, toolMat(0x16a34a, 0.0, 0.5), 40));
      g.add(tubeMesh([[0, 0.082, 0], [0, 0.11, 0.004], [-0.02, 0.14, 0.02], [-0.06, 0.15, 0.03]], 0.0048,
        new THREE.MeshStandardMaterial({ color: 0xdbeafe, transparent: true, opacity: 0.4, roughness: 0.1 }), 40));
      g.add(tubeMesh([[-0.011, 0.03, 0], [-0.03, 0.04, 0.01], [-0.06, 0.06, 0.0]], 0.002, gray, 30));

      addGlow(g, glows, 0x2dd4bf, 0.003, 0.35, 0, TIP_Y, 0);
    }

    // Laser óptico: peça de mão fina com fibra óptica e feixe de mira
    function buildLaser(g, glows, standoff) {
      const black = toolMat(0x15181e, 0.6, 0.35);
      const steel = toolMat(0xd5dbe3, 0.95, 0.2);

      g.add(latheMesh([
        [0.0016, -0.12], [0.0028, -0.112], [0.0062, -0.092], [0.0072, -0.05], [0.0072, 0.04],
        [0.0056, 0.062], [0.0034, 0.07]
      ], black));
      [-0.07, -0.045, -0.02].forEach(y => g.add(ringMesh(0.0074, 0.0007, y, steel)));
      g.add(ringMesh(0.0074, 0.0007, 0.02, new THREE.MeshStandardMaterial({ color: 0xec4899, emissive: 0xec4899, emissiveIntensity: 0.9 })));

      const fiber = new THREE.Mesh(new THREE.CylinderGeometry(0.0005, 0.0005, 0.03, 10), toolMat(0xf1f5f9, 0.2, 0.1));
      fiber.position.y = -0.14;
      g.add(fiber);

      g.add(tubeMesh([[0, 0.07, 0], [0.003, 0.09, 0.004], [0.02, 0.13, 0.01], [0.06, 0.14, 0]], 0.0016, toolMat(0xfbbf24, 0.0, 0.5), 40));

      const beam = new THREE.Mesh(new THREE.CylinderGeometry(0.0005, 0.0005, standoff, 8), glowMat(0xff2d95, 0.85));
      beam.position.y = TIP_Y - standoff / 2;
      g.add(beam);

      addGlow(g, glows, 0xff2d95, 0.0022, 0.9, 0, TIP_Y - standoff, 0);
      addGlow(g, glows, 0xff2d95, 0.0012, 0.9, 0, TIP_Y, 0);
    }

    function buildActive3DTool() {
      if (tool3DMesh && surgicalFieldGroup) surgicalFieldGroup.remove(tool3DMesh);

      const g = new THREE.Group();
      const glows = [];
      let standoff = 0;

      if (currentTool === 'scalpel') buildScalpel(g, glows);
      else if (currentTool === 'cautery') buildCautery(g, glows);
      else if (currentTool === 'suction') buildSuction(g, glows);
      else { standoff = 0.03; buildLaser(g, glows, standoff); }

      g.userData.glows = glows;
      g.rotation.z = -Math.PI / 4;
      const d = 0.155 + standoff; // distância da origem do instrumento até o ponto de trabalho
      g.position.set(craniAnchor.x + d * 0.7071, craniAnchor.y + d * 0.7071, craniAnchor.z);

      tool3DMesh = g;
      if (surgicalFieldGroup) surgicalFieldGroup.add(tool3DMesh);
    }

    function buildLeftSideTelemetryMonitor() {
      telemetryBoardGroup = new THREE.Group();

      telemetryCanvas = document.createElement('canvas');

      telemetryCtx = telemetryCanvas.getContext('2d');

      telemetryTexture = new THREE.CanvasTexture(telemetryCanvas);
      telemetryTexture.minFilter = THREE.LinearFilter;

      const boardMesh = new THREE.Mesh(
        new THREE.PlaneGeometry(2.4, 1.8),
        new THREE.MeshBasicMaterial({ map: telemetryTexture, side: THREE.DoubleSide })
      );
      telemetryBoardGroup.add(boardMesh);

      const frame = new THREE.Mesh(
        new THREE.BoxGeometry(2.46, 1.86, 0.04),
        new THREE.MeshStandardMaterial({ color: 0x0f172a, metalness: 0.8, roughness: 0.3 })
      );
      frame.position.z = -0.025;
      telemetryBoardGroup.add(frame);

      scene.add(telemetryBoardGroup);
      updateTelemetryCanvas();
    }

    let ecgTick = 0;
    function updateTelemetryCanvas() {
      if (!telemetryCtx) return;
      const ctx = telemetryCtx;
      const w = telemetryCanvas.width;
      const h = telemetryCanvas.height;

      ctx.fillStyle = '#060d1f';
      ctx.fillRect(0, 0, w, h);

      ctx.fillStyle = '#00f0ff';
      ctx.font = 'bold 36px monospace';
      ctx.fillText("TELEMETRIA CIRÚRGICA // PACIENTE ID-894", 40, 60);

      ctx.fillStyle = '#64748b';
      ctx.font = '24px monospace';
      ctx.fillText("UTI NEUROCIRÚRGICA • NAVEGAÇÃO ATIVA", 40, 100);

      ctx.strokeStyle = '#00f0ff';
      ctx.lineWidth = 3;
      ctx.beginPath();
      ctx.moveTo(40, 120);
      ctx.lineTo(w - 40, 120);
      ctx.stroke();

      ctx.fillStyle = '#10b981';
      ctx.font = 'bold 44px monospace';
      ctx.fillText("ECG DERIVAÇÃO II", 40, 180);
      ctx.fillText("72 BPM", w - 240, 180);

      ctx.strokeStyle = '#10b981';
      ctx.lineWidth = 4;
      ctx.beginPath();
      ctx.moveTo(40, 270);

      ecgTick += 4;
      if (ecgTick > w - 80) ecgTick = 0;

      for (let x = 40; x < w - 40; x += 10) {
        const relX = (x + ecgTick) % 240;
        let y = 270;
        if (relX > 60 && relX < 80) y -= 15;
        else if (relX >= 90 && relX < 100) y += 10;
        else if (relX >= 100 && relX < 115) y -= 75;
        else if (relX >= 115 && relX < 125) y += 25;
        else if (relX >= 150 && relX < 180) y -= 25;
        ctx.lineTo(x, y);
      }
      ctx.stroke();

      ctx.fillStyle = '#38bdf8';
      ctx.font = 'bold 34px monospace';
      ctx.fillText("PA: 120/80 mmHg", 40, 380);
      ctx.fillText("SpO₂: 99%", 440, 380);
      ctx.fillText("PIC: 11.4 mmHg", 720, 380);

      ctx.fillStyle = '#f8fafc';
      ctx.font = 'bold 30px sans-serif';
      ctx.fillText(`VOLUME DA LESÃO (GLIOMA): ${tumorHealth}%`, 40, 480);

      ctx.fillStyle = '#1e293b';
      ctx.fillRect(40, 510, w - 80, 40);
      ctx.fillStyle = tumorHealth > 30 ? '#10b981' : '#00f0ff';
      ctx.fillRect(40, 510, (w - 80) * (tumorHealth / 100), 40);

      ctx.fillStyle = '#e2e8f0';
      ctx.font = '28px sans-serif';
      ctx.fillText("Conduta: Mantenha a hemostasia e aspire a margem com CUSA.", 40, 620);
      ctx.fillText("Status da Hemostasia: 100% sob controle estéril.", 40, 670);

      telemetryTexture.needsUpdate = true;
    }

    function selectTool(toolKey) {
      currentTool = toolKey;

      ['scalpel', 'cautery', 'suction', 'laser'].forEach(key => {
        const btn = document.getElementById(`tool-${key}`);
        if (btn) {
          if (key === toolKey) btn.className = 'btn-spatial btn-spatial-active px-3 py-1.5 rounded-xl text-xs font-hud font-bold flex items-center gap-1.5';
          else btn.className = 'btn-spatial px-3 py-1.5 rounded-xl text-xs font-hud font-bold flex items-center gap-1.5 text-gray-300';
        }
      });

      buildActive3DTool();
      playToolSound(toolKey);
      showToast(`Instrumento Ativo: ${toolKey.toUpperCase()}`);
    }

    function executeSurgicalAction() {
      playToolSound(currentTool);
      toolFlashUntil = performance.now() + 220;

      if (tool3DMesh) {
        tool3DMesh.position.y -= 0.012;
        setTimeout(() => { if (tool3DMesh) tool3DMesh.position.y += 0.012; }, 140);
      }

      tumorHealth = Math.max(0, tumorHealth - 25);
      if (brainTumorMesh) {
        if (tumorHealth === 0) {
          brainTumorMesh.visible = false;
          showToast("✨ LESÃO RESSECADA COM SUCESSO! MARGEM PRESERVADA.");
        } else {
          showToast(`Ação aplicada [Tumor restante: ${tumorHealth}%]`);
        }
      }

      updateTelemetryCanvas();
    }

    function onScenePointerClick(event) {
      if (!camera) return;
      if (event.target && event.target.closest && event.target.closest('#top-bar, #bottom-dock, #restore-hud-btn')) return;

      mouse.x = (event.clientX / window.innerWidth) * 2 - 1;
      mouse.y = -(event.clientY / window.innerHeight) * 2 + 1;
      raycaster.setFromCamera(mouse, camera);

      // Só a janela de craniotomia e o instrumento disparam a ação cirúrgica
      const targets = [];
      if (craniGroup) targets.push(craniGroup);
      if (tool3DMesh) targets.push(tool3DMesh);
      if (targets.length) {
        const hits = raycaster.intersectObjects(targets, true);
        if (hits.length > 0) {
          executeSurgicalAction();
          return;
        }
      }

      if (videoTheaterGroup) {
        const hits = raycaster.intersectObjects(videoTheaterGroup.children, true);
        if (hits.length > 0) {
          const hitObj = hits[0].object;
          if (hitObj.name === "btn_video_toggle") toggleVideoPlayback();
          else if (hitObj.name === "btn_video_mute") toggleVideoMute();
        }
      }
    }

    // ===== Cabeça realista (.glb) =====
    function applyRealisticHead(root) {
      if (!headLocal) return;
      if (realHead) headLocal.remove(realHead);

      realHead = new THREE.Group();
      realHead.add(root);

      // Mede o modelo e escala para ~30 cm (cabeça + pescoço)
      root.updateMatrixWorld(true);
      const box = new THREE.Box3().setFromObject(root);
      const size = new THREE.Vector3();
      box.getSize(size);
      if (!isFinite(size.y) || size.y <= 0) { showToast('Modelo .glb inválido'); realHead = null; return; }
      root.scale.multiplyScalar(0.39 / size.y);
      root.updateMatrixWorld(true);

      // Centraliza em X/Z e alinha o topo do crânio com o da cabeça simples
      const b2 = new THREE.Box3().setFromObject(root);
      const c = new THREE.Vector3();
      b2.getCenter(c);
      realHead.position.set(-c.x, 0.17 - b2.max.y, -c.z);
      // Costas da cabeça/ombros apoiadas na mesa
      if (headRoot) headRoot.position.y = TABLE_TOP_Y + (b2.max.z - b2.min.z) / 2 - 0.002;

      root.traverse(o => { if (o.isMesh) o.frustumCulled = false; });

      primitiveFaceParts.forEach(p => { p.visible = false; });
      headLocal.add(realHead);

      repositionCraniotomy();
    }

    // ===== Craniotomia realista: buraco no couro cabeludo + camadas (pele, osso, dura-máter, cérebro) =====
    const CRANI = { Rs: 0.04, Rb: 0.027, Rd: 0.021, Rc: 0.0215, kappa: 4.0 };
    const TUMOR_COLOR = 0xd0607a;     // massa tumoral
    const TUMOR_EMISSIVE = 0xff2a5f;  // fluorescência rosa-avermelhada do 5-ALA sob luz azul
    let brainMesh = null, brainBaseY = 0, currentCamView = 'surgery';

    function craniBend(r) { return -CRANI.kappa * r * r; }

    // Curvatura da superfície por ângulo (extraída do contorno real do buraco) -> y = c(theta) * r^2
    let craniCurvTable = null;
    function buildCurvTable(loop) {
      const raw = loop.map(p => {
        const r2 = p.x * p.x + p.z * p.z;
        return [Math.atan2(p.z, p.x), Math.max(-14, Math.min(0.5, p.y / Math.max(r2, 1e-6)))];
      }).sort((a, b) => a[0] - b[0]);
      for (let pass = 0; pass < 3; pass++) {
        const n = raw.length, c = raw.map(t => t[1]);
        for (let i = 0; i < n; i++) raw[i][1] = (c[(i + n - 1) % n] + 2 * c[i] + c[(i + 1) % n]) / 4;
      }
      return raw;
    }
    function craniBendAt(x, z) {
      const r2 = x * x + z * z;
      const T = craniCurvTable;
      if (!T || T.length < 3) return -CRANI.kappa * r2;
      const th = Math.atan2(z, x), n = T.length;
      let a0 = T[n - 1], a1 = T[0];
      for (let i = 0; i < n - 1; i++) { if (th >= T[i][0] && th < T[i + 1][0]) { a0 = T[i]; a1 = T[i + 1]; break; } }
      let t0 = a0[0], t1 = a1[0], tt = th;
      if (t1 <= t0) t1 += Math.PI * 2;
      if (tt < t0) tt += Math.PI * 2;
      const f = (tt - t0) / (t1 - t0);
      return (a0[1] + (a1[1] - a0[1]) * f) * r2;
    }

    function craniGyri(x, z) {
      const a = Math.sin(x * 520 + Math.sin(z * 260) * 1.8) * Math.sin(z * 430 + Math.sin(x * 340) * 1.6);
      const b = Math.sin(x * 780 + z * 610 + Math.sin(x * 200) * 2.0);
      return 0.65 * a + 0.35 * b; // -1..1
    }

    function craniCortexY(x, z) {
      const r = Math.sqrt(x * x + z * z);
      const q = r / CRANI.Rc;
      const dome = 0.005 * Math.max(0, 1 - q * q);
      const edge = 0.0045 * smooth01(0.55, 1.0, q);
      return -0.0145 + dome - edge + 0.0011 * craniGyri(x, z);
    }

    function craniNoise(x, y, z) {
      return Math.sin(x * 7.1 + y * 3.3) * Math.sin(y * 6.7 + z * 4.1) * Math.sin(z * 5.3 + x * 2.9)
        + 0.5 * Math.sin(x * 13.7 + z * 9.1 + y * 5.0) * Math.sin(y * 11.3 - x * 6.1);
    }

    function craniDisk(rIn, rOut, nr, nth, yFn, colFn) {
      const pos = [], col = [], idx = [];
      for (let i = 0; i <= nr; i++) {
        const r = rIn + (rOut - rIn) * i / nr;
        for (let j = 0; j <= nth; j++) {
          const th = (j / nth) * Math.PI * 2;
          const x = r * Math.cos(th), z = r * Math.sin(th);
          pos.push(x, yFn(x, z, r), z);
          if (colFn) { const c = colFn(x, z, r); col.push(c[0], c[1], c[2]); }
        }
      }
      for (let i = 0; i < nr; i++) {
        for (let j = 0; j < nth; j++) {
          const a = i * (nth + 1) + j, b = a + 1, c = a + nth + 1, d = c + 1;
          idx.push(a, c, b, b, c, d);
        }
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      if (colFn) g.setAttribute('color', new THREE.Float32BufferAttribute(col, 3));
      g.setIndex(idx);
      g.computeVertexNormals();
      return g;
    }

    // Faixa de triângulos entre duas curvas fechadas com o mesmo número de pontos
    function craniStrip(A, B) {
      const pos = [], idx = [];
      const n = A.length;
      for (let k = 0; k < n; k++) pos.push(A[k].x, A[k].y, A[k].z);
      for (let k = 0; k < n; k++) pos.push(B[k].x, B[k].y, B[k].z);
      for (let k = 0; k < n; k++) {
        const k2 = (k + 1) % n;
        idx.push(k, k2, n + k, k2, n + k2, n + k);
      }
      const g = new THREE.BufferGeometry();
      g.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
      g.setIndex(idx);
      g.computeVertexNormals();
      return g;
    }

    // Remove os triângulos do couro cabeludo dentro do raio R e devolve o contorno do buraco (coordenadas de craniGroup)
    function cutScalpHole(mesh, centerW, R) {
      const geo = mesh.geometry;
      const pos = geo.attributes.position;
      let idx = geo.index ? geo.index.array : null;
      if (!idx) { idx = new Uint32Array(pos.count); for (let i = 0; i < pos.count; i++) idx[i] = i; }

      mesh.updateMatrixWorld(true);
      const m = mesh.matrixWorld;
      const wp = new Float32Array(pos.count * 3);
      const v = new THREE.Vector3();
      for (let i = 0; i < pos.count; i++) {
        v.fromBufferAttribute(pos, i).applyMatrix4(m);
        wp[i * 3] = v.x; wp[i * 3 + 1] = v.y; wp[i * 3 + 2] = v.z;
      }
      const dist = (i) => Math.hypot(wp[i * 3] - centerW.x, wp[i * 3 + 1] - centerW.y, wp[i * 3 + 2] - centerW.z);

      const keep = [];
      for (let t = 0; t < idx.length; t += 3) {
        const a = idx[t], b = idx[t + 1], c = idx[t + 2];
        const cx = (wp[a * 3] + wp[b * 3] + wp[c * 3]) / 3;
        const cy = (wp[a * 3 + 1] + wp[b * 3 + 1] + wp[c * 3 + 1]) / 3;
        const cz = (wp[a * 3 + 2] + wp[b * 3 + 2] + wp[c * 3 + 2]) / 3;
        if (Math.hypot(cx - centerW.x, cy - centerW.y, cz - centerW.z) < R) continue;
        keep.push(a, b, c);
      }
      const removed = idx.length / 3 - keep.length / 3;

      const N = pos.count;
      const edges = new Set();
      for (let t = 0; t < keep.length; t += 3) {
        edges.add(keep[t] * N + keep[t + 1]); edges.add(keep[t + 1] * N + keep[t + 2]); edges.add(keep[t + 2] * N + keep[t]);
      }
      const next = new Map();
      edges.forEach(key => {
        const a = Math.floor(key / N), b = key - a * N;
        if (!edges.has(b * N + a) && dist(a) < R + 0.015 && dist(b) < R + 0.015) next.set(a, b);
      });

      geo.setIndex(new THREE.BufferAttribute(pos.count > 65535 ? new Uint32Array(keep) : new Uint16Array(keep), 1));

      // Percorre o contorno
      let best = null;
      const used = new Set();
      next.forEach((_, start) => {
        if (used.has(start)) return;
        const loop = [start]; used.add(start);
        let cur = next.get(start), guard = 0;
        while (cur !== undefined && cur !== start && guard++ < 5000) { loop.push(cur); used.add(cur); cur = next.get(cur); }
        if (cur === start && (!best || loop.length > best.length)) best = loop;
      });

      if (!best || best.length < 12 || removed < 5) return null;
      craniGroup.updateMatrixWorld(true);
      return best.map(i => craniGroup.worldToLocal(new THREE.Vector3(wp[i * 3], wp[i * 3 + 1], wp[i * 3 + 2])));
    }

    // Tintura de iodo (campo cirúrgico) ao redor da incisão
    function tintIodine(mesh, centerW) {
      const geo = mesh.geometry, pos = geo.attributes.position;
      mesh.updateMatrixWorld(true);
      const col = new Float32Array(pos.count * 3);
      const v = new THREE.Vector3();
      for (let i = 0; i < pos.count; i++) {
        v.fromBufferAttribute(pos, i).applyMatrix4(mesh.matrixWorld);
        const t = smooth01(0.13, 0.055, v.distanceTo(centerW)) * 0.85;
        col[i * 3] = 1.0; col[i * 3 + 1] = 1.0 - t * 0.34; col[i * 3 + 2] = 1.0 - t * 0.62;
      }
      geo.setAttribute('color', new THREE.BufferAttribute(col, 3));
      mesh.material.vertexColors = true;
      mesh.material.needsUpdate = true;
    }

    function buildCraniotomyDetail(loopIn) {
      const R = CRANI;
      let loop = loopIn;
      if (!loop) { // contorno circular de reserva
        loop = [];
        for (let k = 0; k < 72; k++) { const th = k / 72 * Math.PI * 2; loop.push(new THREE.Vector3(R.Rs * Math.cos(th), craniBend(R.Rs), R.Rs * Math.sin(th))); }
      }
      craniCurvTable = loopIn ? buildCurvTable(loop) : null;
      const n = loop.length;
      const ang = loop.map(p => Math.atan2(p.z, p.x));

      // --- Pele cortada: parede + borda arredondada ---
      const skinWallMat = new THREE.MeshStandardMaterial({ color: 0xc65d52, roughness: 0.5, side: THREE.DoubleSide });
      const wallBottom = loop.map(p => new THREE.Vector3(p.x, p.y - 0.0065, p.z));
      craniGroup.add(new THREE.Mesh(craniStrip(loop, wallBottom), skinWallMat));

      const rimCurve = new THREE.CatmullRomCurve3(loop.map(p => new THREE.Vector3(p.x, p.y - 0.001, p.z)), true);
      craniGroup.add(new THREE.Mesh(new THREE.TubeGeometry(rimCurve, n * 2, 0.0022, 8, true),
        new THREE.MeshPhysicalMaterial({ color: 0xb0463f, roughness: 0.4, clearcoat: 0.6, clearcoatRoughness: 0.3 })));

      // --- Osso exposto entre a pele e a abertura óssea ---
      const boneMat = new THREE.MeshStandardMaterial({ color: 0xe8dcc3, roughness: 0.6, side: THREE.DoubleSide });
      const boneOuter = loop.map(p => new THREE.Vector3(p.x, p.y - 0.0065, p.z));
      const boneInner = ang.map(a => { const x = R.Rb * Math.cos(a), z = R.Rb * Math.sin(a); return new THREE.Vector3(x, craniBendAt(x, z) - 0.006, z); });
      craniGroup.add(new THREE.Mesh(craniStrip(boneOuter, boneInner), boneMat));

      // parede do corte ósseo (com diploe rosado)
      const boneBottom = boneInner.map(p => new THREE.Vector3(p.x, p.y - 0.0065, p.z));
      craniGroup.add(new THREE.Mesh(craniStrip(boneInner, boneBottom),
        new THREE.MeshStandardMaterial({ color: 0xe6c4b0, roughness: 0.65, side: THREE.DoubleSide })));

      // --- Dura-máter (aberta em cruz, folhetos rebatidos) ---
      const duraMat = new THREE.MeshStandardMaterial({ color: 0xcfc4a5, roughness: 0.55, side: THREE.DoubleSide });
      craniGroup.add(new THREE.Mesh(craniDisk(R.Rd, R.Rb + 0.004, 4, 96,
        (x, z, r) => craniBendAt(x, z) - 0.0155 + 0.0004 * Math.sin(x * 900) * Math.sin(z * 800)), duraMat));
      for (let f = 0; f < 4; f++) {
        const th = Math.PI / 4 + f * Math.PI / 2;
        const flap = new THREE.Mesh(new THREE.BufferGeometry(), new THREE.MeshStandardMaterial({ color: 0xdbd1b4, roughness: 0.5, side: THREE.DoubleSide }));
        const r0 = R.Rd - 0.0005, r1 = R.Rb;
        const pts = [
          [r0 * Math.cos(th - 0.34), r0 * Math.sin(th - 0.34)],
          [r0 * Math.cos(th + 0.34), r0 * Math.sin(th + 0.34)],
          [r1 * Math.cos(th + 0.05), r1 * Math.sin(th + 0.05)],
          [r1 * Math.cos(th - 0.05), r1 * Math.sin(th - 0.05)]
        ].map(p => [p[0], craniBendAt(p[0], p[1]) - 0.0143, p[1]]);
        flap.geometry.setAttribute('position', new THREE.Float32BufferAttribute(pts.flat(), 3));
        flap.geometry.setIndex([0, 1, 2, 0, 2, 3]);
        flap.geometry.computeVertexNormals();
        craniGroup.add(flap);
      }

      // --- Córtex cerebral com giros, sulcos e brilho úmido ---
      const cortexGeo = craniDisk(0, R.Rc, 48, 128,
        (x, z) => craniCortexY(x, z),
        (x, z) => {
          const t = (craniGyri(x, z) + 1) / 2;
          const k = t * t * (3 - 2 * t);
          return [0.56 + (0.9 - 0.56) * k, 0.3 + (0.63 - 0.3) * k, 0.29 + (0.59 - 0.29) * k];
        });
      brainMesh = new THREE.Mesh(cortexGeo, new THREE.MeshPhysicalMaterial({
        vertexColors: true, roughness: 0.4, metalness: 0.0, clearcoat: 0.9, clearcoatRoughness: 0.25, side: THREE.DoubleSide
      }));
      craniGroup.add(brainMesh);
      brainBaseY = 0;

      // vasos superficiais (artérias vermelhas, veias azul-arroxeadas)
      for (let k = 0; k < 8; k++) {
        const th0 = k * 0.83 + 0.3;
        const isVein = k % 3 === 0;
        const pts = [];
        for (let s = 0; s <= 40; s++) {
          const u = s / 40;
          const r = (R.Rc - 0.001) * (1 - u) + 0.005 * u;
          const th = th0 + 0.45 * Math.sin(u * 5.2 + k) + 0.25 * u;
          const x = r * Math.cos(th), z = r * Math.sin(th);
          pts.push(new THREE.Vector3(x, craniCortexY(x, z) + 0.0012, z));
        }
        craniGroup.add(new THREE.Mesh(new THREE.TubeGeometry(new THREE.CatmullRomCurve3(pts), 60, isVein ? 0.0007 : 0.0005, 6, false),
          new THREE.MeshStandardMaterial({ color: isVein ? 0x4f4a9a : 0xc0262d, roughness: 0.35 })));
      }

      // --- Tumor (massa lobulada, com fluorescência 5-ALA) ---
      const tg = new THREE.IcosahedronGeometry(0.0095, 4);
      const tp = tg.attributes.position;
      const tcol = new Float32Array(tp.count * 3);
      const vv = new THREE.Vector3();
      for (let i = 0; i < tp.count; i++) {
        vv.fromBufferAttribute(tp, i).normalize();
        const nz = craniNoise(vv.x * 3.2, vv.y * 3.2, vv.z * 3.2);
        const rad = 0.0095 * (1 + 0.2 * nz);
        tp.setXYZ(i, vv.x * rad, vv.y * rad * 0.8, vv.z * rad);
        const m = 0.5 + 0.5 * craniNoise(vv.x * 8, vv.y * 8, vv.z * 8);
        tcol[i * 3] = 0.85 + 0.15 * m; tcol[i * 3 + 1] = 0.4 + 0.25 * m; tcol[i * 3 + 2] = 0.5 + 0.2 * m;
      }
      tg.setAttribute('color', new THREE.BufferAttribute(tcol, 3));
      tg.computeVertexNormals();
      brainTumorMesh = new THREE.Mesh(tg, new THREE.MeshPhysicalMaterial({
        vertexColors: true, color: TUMOR_COLOR, emissive: TUMOR_EMISSIVE, emissiveIntensity: 0.45,
        roughness: 0.35, clearcoat: 0.7, clearcoatRoughness: 0.3
      }));
      brainTumorMesh.position.set(0.002, craniCortexY(0.002, 0.001) + 0.0012, 0.001);
      brainTumorMesh.name = 'brain_tumor_target';
      craniGroup.add(brainTumorMesh);

      // --- Afastadores de cérebro (lâminas + hastes) e cotonoides ---
      const steel = toolMat(0xd5dbe3, 0.95, 0.22);
      [2.1, 5.2].forEach(th => {
        const rc = 0.0155;
        const bx = rc * Math.cos(th), bz = rc * Math.sin(th);
        const blade = new THREE.Mesh(new THREE.BoxGeometry(0.0055, 0.0007, 0.016), steel);
        blade.position.set(bx, craniCortexY(bx, bz) + 0.0014, bz);
        blade.rotation.y = Math.PI / 2 - th;
        craniGroup.add(blade);
        const ox = 0.0245 * Math.cos(th), oz = 0.0245 * Math.sin(th);
        craniGroup.add(tubeMesh([[ox, craniCortexY(ox, oz) + 0.003, oz],
          [0.036 * Math.cos(th), 0.012, 0.036 * Math.sin(th)],
          [0.06 * Math.cos(th), 0.03, 0.06 * Math.sin(th)],
          [0.085 * Math.cos(th), 0.034, 0.085 * Math.sin(th)]], 0.0012, steel, 30));
      });
      [0.55, 3.7].forEach(th => {
        const rc = 0.0185;
        const px = rc * Math.cos(th), pz = rc * Math.sin(th);
        const patty = new THREE.Mesh(new THREE.BoxGeometry(0.011, 0.0012, 0.007),
          new THREE.MeshStandardMaterial({ color: 0xe9ebe2, roughness: 0.95 }));
        patty.position.set(px, craniCortexY(px, pz) + 0.001, pz);
        patty.rotation.y = -th;
        craniGroup.add(patty);
        craniGroup.add(tubeMesh([[px, craniCortexY(px, pz) + 0.0015, pz],
          [0.03 * Math.cos(th), 0.002, 0.03 * Math.sin(th)],
          [0.05 * Math.cos(th), 0.006, 0.05 * Math.sin(th)]], 0.0004, toolMat(0x15803d, 0, 0.7), 20));
      });

      // --- Sangue na borda da incisão ---
      const bloodMat = new THREE.MeshPhysicalMaterial({ color: 0x7a0f14, roughness: 0.15, clearcoat: 1.0, clearcoatRoughness: 0.1 });
      for (let k = 0; k < 7; k++) {
        const p = loop[Math.floor((k + 0.5) * n / 7)];
        const b = new THREE.Mesh(new THREE.SphereGeometry(1, 12, 8), bloodMat);
        b.scale.set(0.0035 + 0.0015 * (k % 3), 0.0010, 0.003 + 0.001 * (k % 2));
        b.position.set(p.x * 0.97, p.y - 0.004, p.z * 0.97);
        craniGroup.add(b);
      }

      // luz pontual quente para o brilho úmido
      const wet = new THREE.PointLight(0xfff2e0, 0.5, 0.6);
      wet.position.set(0.03, 0.12, 0.04);
      craniGroup.add(wet);
    }

    // Encaixa a janela de craniotomia na testa da cabeça realista e abre o buraco de verdade
    function repositionCraniotomy() {
      if (!realHead || !craniGroup || !scene) return;
      scene.updateMatrixWorld(true);

      const meshes = [];
      realHead.traverse(o => { if (o.isMesh) meshes.push(o); });

      const ray = new THREE.Raycaster(new THREE.Vector3(0, 3, HEAD_Z + 0.118), new THREE.Vector3(0, -1, 0));
      const hits = ray.intersectObjects(meshes, false);
      if (!hits.length) return;

      const h = hits[0];
      const n = h.face
        ? h.face.normal.clone().transformDirection(h.object.matrixWorld).normalize()
        : new THREE.Vector3(0, 1, 0);
      if (n.y < 0) n.negate();

      craniGroup.position.copy(h.point);
      craniGroup.quaternion.setFromUnitVectors(new THREE.Vector3(0, 1, 0), n);
      craniGroup.scale.setScalar(1);
      craniGroup.updateMatrixWorld(true);

      while (craniGroup.children.length) {
        const c = craniGroup.children[0];
        craniGroup.remove(c);
        if (c.geometry) c.geometry.dispose();
      }
      craniotomyRingMesh = null;

      let loop = null;
      try {
        loop = cutScalpHole(h.object, h.point, CRANI.Rs);
        tintIodine(h.object, h.point);
      } catch (e) { console.warn('Falha ao abrir o couro cabeludo:', e); }
      buildCraniotomyDetail(loop);

      craniAnchor.copy(h.point).addScaledVector(n, -0.006);
      buildActive3DTool();
      if (currentCamView === 'surgery') setCameraView('surgery');
    }

    async function tryLoadHeadModel() {
      try {
        if (typeof DecompressionStream === 'undefined') throw new Error('sem DecompressionStream');
        const raw = Uint8Array.from(atob(HEAD_PACK_B64), c => c.charCodeAt(0));
        const stream = new Blob([raw]).stream().pipeThrough(new DecompressionStream('deflate'));
        const buf = await new Response(stream).arrayBuffer();

        const hdr = new DataView(buf, 0, 32);
        const mn = [0, 1, 2].map(i => hdr.getFloat32(i * 4, true));
        const rg = [3, 4, 5].map(i => hdr.getFloat32(i * 4, true));
        const nV = hdr.getUint32(24, true), nI = hdr.getUint32(28, true);

        const qp = new Uint16Array(buf, 32, nV * 3);
        const quv = new Uint16Array(buf, 32 + nV * 6, nV * 2);
        const idx = new Uint16Array(buf, 32 + nV * 6 + nV * 4, nI);

        const pos = new Float32Array(nV * 3);
        for (let i = 0; i < nV; i++) {
          for (let k = 0; k < 3; k++) pos[i * 3 + k] = mn[k] + (qp[i * 3 + k] / 65535) * rg[k];
        }
        const uv = new Float32Array(nV * 2);
        for (let i = 0; i < nV * 2; i++) uv[i] = quv[i] / 65535;

        const geo = new THREE.BufferGeometry();
        geo.setAttribute('position', new THREE.BufferAttribute(pos, 3));
        geo.setAttribute('uv', new THREE.BufferAttribute(uv, 2));
        geo.setIndex(new THREE.BufferAttribute(new Uint16Array(idx), 1));
        geo.computeVertexNormals();

        const texLoader = new THREE.TextureLoader();
        const colorMap = texLoader.load(HEAD_COL_URI);
        colorMap.encoding = THREE.sRGBEncoding;
        colorMap.anisotropy = 8;
        const normalMap = texLoader.load(HEAD_NRM_URI);

        const mesh = new THREE.Mesh(geo, new THREE.MeshStandardMaterial({
          map: colorMap, normalMap: normalMap, normalScale: new THREE.Vector2(0.9, 0.9),
          roughness: 0.55, metalness: 0.0
        }));
        const root = new THREE.Group();
        root.add(mesh);
        applyRealisticHead(root);
        showToast('Cabeça humana realista carregada');
      } catch (e) {
        console.warn('Cabeça realista indisponível:', e);
        showToast('Cabeça realista indisponível — usando cabeça simples');
      }
    }

    function handleUserHeadFile(event) {
      const file = event.target.files[0];
      if (!file) return;
      const reader = new FileReader();
      reader.onload = e => {
        new THREE.GLTFLoader().parse(e.target.result, '',
          gltf => { applyRealisticHead(gltf.scene); showToast('Cabeça carregada: ' + file.name.substring(0, 20)); },
          () => showToast('Falha ao ler o arquivo .glb')
        );
      };
      reader.readAsArrayBuffer(file);
    }

    function handleUserVideoFile(event) {
      const file = event.target.files[0];
      if (!file || !videoElement) return;

      videoElement.src = URL.createObjectURL(file);
      videoElement.muted = false;
      videoElement.load();
      videoElement.play();

      setCameraView('theater');
      showToast(`Vídeo carregado: ${file.name.substring(0, 20)}...`);
    }

    function toggleVideoPlayback() {
      if (!videoElement) return;
      initAudio();
      if (videoElement.paused) {
        videoElement.play();
        showToast("🎬 Telão: Reproduzindo vídeo");
      } else {
        videoElement.pause();
        showToast("⏸️ Telão: Pausado");
      }
    }

    function toggleVideoMute() {
      if (!videoElement) return;
      videoElement.muted = !videoElement.muted;
      showToast(videoElement.muted ? "🔇 Telão no Mudo" : "🔊 Áudio do Telão Ativado");
    }

    let toastTimeout = null;
    function showToast(msg) {
      const toast = document.getElementById('action-toast');
      const text = document.getElementById('toast-message');
      if (!toast || !text) return;

      text.textContent = msg;
      toast.classList.remove('opacity-0');

      if (toastTimeout) clearTimeout(toastTimeout);
      toastTimeout = setTimeout(() => { toast.classList.add('opacity-0'); }, 2600);
    }

    let isCleanField = false;
    function toggleCleanFieldMode() {
      isCleanField = !isCleanField;
      const topBar = document.getElementById('top-bar');
      const bottomDock = document.getElementById('bottom-dock');
      const restoreBtn = document.getElementById('restore-hud-btn');

      if (isCleanField) {
        if (topBar) topBar.classList.add('hud-hidden');
        if (bottomDock) bottomDock.classList.add('hud-hidden');
        if (restoreBtn) restoreBtn.classList.remove('hidden');
      } else {
        if (topBar) topBar.classList.remove('hud-hidden');
        if (bottomDock) bottomDock.classList.remove('hud-hidden');
        if (restoreBtn) restoreBtn.classList.add('hidden');
      }
    }

    function setCameraView(viewKey) {
      currentCamView = viewKey;
      ['surgery', 'theater', 'monitor', 'overview', 'patient'].forEach(k => {
        const btn = document.getElementById(`cam-btn-${k}`);
        if (btn) {
          if (k === viewKey) btn.className = 'btn-spatial btn-spatial-active px-3 py-1.5 rounded-xl text-xs font-mono-tech flex items-center gap-1.5';
          else btn.className = 'btn-spatial px-3 py-1.5 rounded-xl text-xs font-mono-tech text-gray-300 flex items-center gap-1.5';
        }
      });

      if (!camera || !controls) return;

      if (viewKey === 'surgery') {
        // Visão do cirurgião, posicionado à cabeceira, olhando a janela de craniotomia
        camera.position.set(craniAnchor.x, craniAnchor.y + 0.26, craniAnchor.z + 0.2);
        controls.target.copy(craniAnchor);
      } else if (viewKey === 'theater') {
        camera.position.set(0.6, 1.7, 0.8);
        controls.target.set(2.4, 1.8, -0.6);
      } else if (viewKey === 'monitor') {
        camera.position.set(-0.6, 1.7, 0.8);
        controls.target.set(-2.4, 1.8, -0.6);
      } else if (viewKey === 'overview') {
        camera.position.set(1.6, 2.3, 1.9);
        controls.target.set(0, 1.1, -0.5);
      } else if (viewKey === 'patient') {
        // Vista lateral do paciente inteiro
        camera.position.set(2.2, 1.7, -0.5);
        controls.target.set(0, 1.1, -0.6);
      }
      controls.update();
    }

    function initSpatialOperatingRoom() {
      const container = document.getElementById('webgl-container');
      const width = window.innerWidth || document.documentElement.clientWidth;
      const height = window.innerHeight || document.documentElement.clientHeight;

      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x050b14);

      camera = new THREE.PerspectiveCamera(50, width / height, 0.1, 100);
      camera.position.set(0, 1.78, 1.05);

      renderer = new THREE.WebGLRenderer({ antialias: true, alpha: false, powerPreference: "high-performance" });
      renderer.setSize(width, height);
      renderer.setPixelRatio(Math.min(window.devicePixelRatio || 1, 2));
      renderer.xr.enabled = true;
      renderer.outputEncoding = THREE.sRGBEncoding;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 0.9;
      container.appendChild(renderer.domElement);

      const vrBtn = VRButtonHelper.createButton(renderer);
      const vrMount = document.getElementById('vr-button-mount');
      if (vrMount) vrMount.appendChild(vrBtn);

      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.maxPolarAngle = Math.PI / 2 + 0.08;
      controls.minDistance = 0.08;
      controls.maxDistance = 10;
      controls.target.set(0, 1.3, 0.4);

      buildToolEnvMap();
      setupORLighting();
      buildArchitecturalRoom();
      buildCentralSurgicalField();
      buildRightSideTheaterScreen();
      buildLeftSideTelemetryMonitor();
      tryLoadHeadModel();

      window.addEventListener('resize', onWindowResize);
      window.addEventListener('click', onScenePointerClick);

      renderer.render(scene, camera);
      renderer.setAnimationLoop(renderLoop);
    }

    let lastEcgUpdate = 0;
    function renderLoop(timestamp = 0) {
      const time = clock.getElapsedTime();

      if (controls) controls.update();

      // Respiração torácica (o lençol sobe e desce sobre o tórax)
      updateSheetBreath(time);

      // Brilho/pulsação na ponta do instrumento ativo
      if (tool3DMesh && tool3DMesh.userData.glows) {
        const flash = performance.now() < toolFlashUntil ? 2.2 : 1;
        const f = (1 + 0.15 * Math.sin(time * 28)) * flash;
        tool3DMesh.userData.glows.forEach(m => m.scale.setScalar(f));
      }

      // Pulsação do tumor
      if (brainTumorMesh && brainTumorMesh.visible) {
        const pulse = (tumorHealth / 100) * (1.0 + Math.sin(time * 4.0) * 0.08);
        const s = Math.max(0.1, pulse);
        brainTumorMesh.scale.set(s, s, s);
      }

      if (craniotomyRingMesh) craniotomyRingMesh.rotation.z += 0.005;
      if (brainMesh) brainMesh.position.y = brainBaseY + 0.0004 * Math.sin(time * 7.5);

      if (timestamp - lastEcgUpdate > 80) {
        updateTelemetryCanvas();
        lastEcgUpdate = timestamp;
      }

      renderer.render(scene, camera);
    }

    function onWindowResize() {
      if (!camera || !renderer) return;
      const w = window.innerWidth;
      const h = window.innerHeight;
      camera.aspect = w / h;
      camera.updateProjectionMatrix();
      renderer.setSize(w, h);
    }

    window.onload = function () {
      initSpatialOperatingRoom();
      setCameraView('surgery');
    };
  </script>
</body>
