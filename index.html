<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Templo da Medicina Ancestral // Egito VR</title>
  
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>

  <style>
    body { margin: 0; overflow: hidden; background: #000; }
  </style>

  <script>
    // Sintetizador de Audio Procedural
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playEgyptianSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'hover') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(660, now + 0.1);
        gain.gain.setValueAtTime(0.04, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.1);
        osc.start(now);
        osc.stop(now + 0.1);
      } else if (type === 'portal') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(160, now);
        osc.frequency.exponentialRampToValueAtTime(440, now + 0.25);
        gain.gain.setValueAtTime(0.09, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.25);
        osc.start(now);
        osc.stop(now + 0.25);
      }
    }

    // Textos limpos para renderizacao precisa em VR (sem quebra de glifos)
    const timelineData = [
      {
        epoca: "I. EGITO PRIMORDIAL",
        periodo: "3000 a.C.",
        subtitulo: "A Aurora da Cura e da Anatomia Sagrada",
        topicos: [
          "[+] Papiros Edwin Smith e Ebers: primeiros tratados medicos.",
          "[+] Uso refinado de mel, mirra, sais e plantas curativas.",
          "[+] Mumificacao: inicio da cartografia dos orgaos vitais.",
          "[+] Reducao de fraturas e traumas com talas de madeira.",
          "[+] Imhotep: o pioneiro divinizado pela arte da cura."
        ],
        artefato: "egypt"
      },
      {
        epoca: "II. GRECIA CLASSICA",
        periodo: "400 a.C.",
        subtitulo: "O Nascimento da Medicina Racional",
        topicos: [
          "[+] Hipocrates: causas naturais em vez de castigo dos deuses.",
          "[+] Metodo clinico: escuta, inspecao e registro sistematico.",
          "[+] Juramento Hipocratico: marco formal da etica medica.",
          "[+] Teoria dos quatro humores e busca da homeostase."
        ],
        artefato: "greece"
      },
      {
        epoca: "III. IDADE MEDIA & ORIENTE",
        periodo: "500 a 1500",
        subtitulo: "A Luz dos Manuscritos e o Canone",
        topicos: [
          "[+] Avicena publica a enciclopedia 'Canone da Medicina'.",
          "[+] Fundacao de hospitais estruturados (Bimaristan).",
          "[+] Preservacao e traducao de tratados greco-romanos.",
          "[+] Avancos cirurgicos em oftalmologia e extracao de catarata."
        ],
        artefato: "middle_ages"
      },
      {
        epoca: "IV. O RENASCIMENTO",
        periodo: "1500 a 1600",
        subtitulo: "A Verdadeira Anatomia Revelada",
        topicos: [
          "[+] Andreas Vesalius publica 'De Humani Corporis Fabrica'.",
          "[+] Dissecacoes cadavericas refutam antigos erros de Galeno.",
          "[+] Leonardo da Vinci estuda as valvulas e o fluxo cardiaco.",
          "[+] Observacao direta suplanta dogmas e crencas antigas."
        ],
        artefato: "renaissance"
      },
      {
        epoca: "V. SECULO XVII",
        periodo: "1600",
        subtitulo: "A Maquina Humana e o Infinitamente Pequeno",
        topicos: [
          "[+] William Harvey demonstra a circulacao sanguinea (1628).",
          "[+] Inicio da microscopia optica com lentes polidas.",
          "[+] Robert Hooke cunha o termo fundamental 'celula' (1665).",
          "[+] Leeuwenhoek observa microrganismos vivos na agua e saliva."
        ],
        artefato: "microscope"
      },
      {
        epoca: "VI. SECULOS XVIII E XIX",
        periodo: "1700 a 1899",
        subtitulo: "A Triade: Vacinas, Antissepsia e Raios-X",
        topicos: [
          "[+] 1796: Edward Jenner cria a vacina contra a variola.",
          "[+] 1846: Primeira cirurgia com anestesia por eter.",
          "[+] Pasteur consolida a Teoria Germinativa das infeccoes.",
          "[+] 1867: Joseph Lister introduz a antissepsia cirurgica.",
          "[+] 1895: Wilhelm Rontgen descobre os Raios X."
        ],
        artefato: "xray"
      },
      {
        epoca: "VII. SECULO XX",
        periodo: "1900 a 1999",
        subtitulo: "Antibioticos, Genoma e Imagens 3D",
        topicos: [
          "[+] 1928: Fleming descobre a penicilina, salvando milhoes.",
          "[+] 1953: Decifracao da estrutura em dupla helice do DNA.",
          "[+] 1967: Primeiro transplante cardiaco humano bem-sucedido.",
          "[+] Diagnosticos avancados: Tomografia e Ressonancia Magnetica.",
          "[+] Primeiros robos auxiliam procedimentos cirurgicos."
        ],
        artefato: "dna"
      },
      {
        epoca: "SINTESE // O LEGADO",
        periodo: "Seculo XXI+",
        subtitulo: "O Futuro da Medicina",
        topicos: [
          "Da observacao do corpo humano as tecnologias",
          "que revolucionaram os diagnosticos e tratamentos,",
          "cada descoberta abriu caminho para uma medicina",
          "mais precisa, segura e eficaz."
        ],
        artefato: "future"
      }
    ];

    let currentIndex = 0;

    function buildArtifact(type) {
      const stage = document.getElementById("relic-stage");
      stage.innerHTML = "";

      if (type === "egypt") {
        stage.innerHTML = `
          <a-tetrahedron radius="0.55" color="#ffd700" material="metalness: 0.8; roughness: 0.2"
                         position="0 0 0" animation="property: rotation; to: 0 360 0; loop: true; dur: 9000; easing: linear">
            <a-ring radius-inner="0.65" radius-outer="0.67" color="#00f0ff" rotation="90 0 0"></a-ring>
          </a-tetrahedron>
          <a-sphere radius="0.12" color="#00ffff" position="0 0.5 0"
                    animation="property: position; to: 0 0.65 0; dir: alternate; loop: true; dur: 1200"></a-sphere>
        `;
      } else if (type === "greece") {
        stage.innerHTML = `
          <a-cylinder radius="0.04" height="0.9" color="#e2d4b7" position="0 0 0"></a-cylinder>
          <a-torus radius="0.32" radius-tubular="0.02" color="#00f0ff" rotation="60 30 0"
                   animation="property: rotation; to: 60 390 0; loop: true; dur: 8000; easing: linear"></a-torus>
          <a-sphere radius="0.1" color="#ffd700" position="0 0.5 0"></a-sphere>
        `;
      } else if (type === "middle_ages") {
        stage.innerHTML = `
          <a-box width="0.5" height="0.65" depth="0.12" color="#b08968" position="0 0 0"
                 animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear">
            <a-plane width="0.4" height="0.55" color="#00f0ff" position="0 0 0.07" material="wireframe: true"></a-plane>
          </a-box>
        `;
      } else if (type === "renaissance") {
        stage.innerHTML = `
          <a-sphere radius="0.4" color="#d4a373" wireframe="true"
                    animation="property: rotation; to: 360 360 0; loop: true; dur: 12000; easing: linear"></a-sphere>
          <a-ring radius-inner="0.48" radius-outer="0.5" color="#00f0ff" rotation="45 45 0"
                  animation="property: rotation; to: 45 405 0; loop: true; dur: 6000; easing: linear"></a-ring>
        `;
      } else if (type === "microscope") {
        stage.innerHTML = `
          <a-octahedron radius="0.4" color="#00ffff" material="opacity: 0.7; transparent: true; roughness: 0.1"
                        animation="property: rotation; to: 0 360 360; loop: true; dur: 8000; easing: linear"></a-octahedron>
        `;
      } else if (type === "xray") {
        stage.innerHTML = `
          <a-dodecahedron radius="0.38" color="#00ff88" wireframe="true"
                          animation="property: rotation; to: 360 0 360; loop: true; dur: 7000; easing: linear"></a-dodecahedron>
          <a-sphere radius="0.1" color="#ffffff" animation="property: scale; to: 1.8 1.8 1.8; dir: alternate; loop: true; dur: 900"></a-sphere>
        `;
      } else if (type === "dna") {
        stage.innerHTML = `
          <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear">
            <a-sphere position="0.25 0.35 0" radius="0.09" color="#00f0ff"></a-sphere>
            <a-sphere position="-0.25 0.35 0" radius="0.09" color="#e63946"></a-sphere>
            <a-cylinder position="0 0.35 0" rotation="0 0 90" radius="0.02" height="0.5" color="#ffd700"></a-cylinder>

            <a-sphere position="0 0 0.25" radius="0.09" color="#00f0ff"></a-sphere>
            <a-sphere position="0 0 -0.25" radius="0.09" color="#e63946"></a-sphere>
            <a-cylinder position="0 0 0" rotation="90 0 0" radius="0.02" height="0.5" color="#ffd700"></a-cylinder>

            <a-sphere position="-0.25 -0.35 0" radius="0.09" color="#00f0ff"></a-sphere>
            <a-sphere position="0.25 -0.35 0" radius="0.09" color="#e63946"></a-sphere>
            <a-cylinder position="0 -0.35 0" rotation="0 0 90" radius="0.02" height="0.5" color="#ffd700"></a-cylinder>
          </a-entity>
        `;
      } else {
        stage.innerHTML = `
          <a-sphere radius="0.38" color="#ffd700" wireframe="true"
                    animation="property: rotation; to: 360 360 0; loop: true; dur: 4000; easing: linear"></a-sphere>
          <a-ring radius-inner="0.45" radius-outer="0.48" color="#00f0ff"
                  animation="property: rotation; to: 0 360 360; loop: true; dur: 3000; easing: linear"></a-ring>
        `;
      }
    }

    function renderDisplay(index) {
      const data = timelineData[index];
      document.getElementById("card-title").setAttribute("value", `${data.epoca} [${data.periodo}]`);
      document.getElementById("card-subtitle").setAttribute("value", data.subtitulo);
      document.getElementById("card-content").setAttribute("value", data.topicos.join("\n\n"));
      document.getElementById("status-code").setAttribute("value", `REGISTRO: 0${index + 1} / 0${timelineData.length}`);

      buildArtifact(data.artefato);

      for (let i = 0; i < timelineData.length; i++) {
        const stone = document.getElementById(`stone-${i}`);
        if (stone) {
          if (i === index) {
            stone.setAttribute("color", "#00ffff");
            stone.setAttribute("scale", "1.4 1.4 1.4");
          } else {
            stone.setAttribute("color", "#7f5539");
            stone.setAttribute("scale", "1 1 1");
          }
        }
      }
    }

    AFRAME.registerComponent('totem-interact', {
      schema: { action: { type: 'string' }, targetIndex: { type: 'int', default: -1 } },
      init: function () {
        const el = this.el;
        const data = this.data;

        el.addEventListener('mouseenter', () => {
          playEgyptianSound('hover');
          el.setAttribute('material', 'color', '#00f0ff');
          el.setAttribute('scale', '1.04 1.04 1.04');
        });

        el.addEventListener('mouseleave', () => {
          el.setAttribute('material', 'color', '#8a5a36');
          el.setAttribute('scale', '1 1 1');
        });

        el.addEventListener('click', () => {
          playEgyptianSound('portal');
          if (data.action === 'next' && currentIndex < timelineData.length - 1) {
            currentIndex++;
            renderDisplay(currentIndex);
          } else if (data.action === 'prev' && currentIndex > 0) {
            currentIndex--;
            renderDisplay(currentIndex);
          } else if (data.action === 'jump') {
            currentIndex = data.targetIndex;
            renderDisplay(currentIndex);
          }
        });
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      const stoneBar = document.getElementById("stone-bar");
      const total = timelineData.length;
      const startX = -1.6;
      const step = 3.2 / (total - 1);

      for (let i = 0; i < total; i++) {
        const stone = document.createElement("a-octahedron");
        stone.setAttribute("id", `stone-${i}`);
        stone.setAttribute("class", "clickable");
        stone.setAttribute("radius", "0.07");
        stone.setAttribute("color", "#7f5539");
        stone.setAttribute("position", `${startX + (i * step)} 0 0.05`);
        stone.setAttribute("totem-interact", `action: jump; targetIndex: ${i}`);
        stoneBar.appendChild(stone);
      }

      renderDisplay(0);
    });
  </script>
</head>
<body>
  <!-- AMBIENTE: EGITO COM PIRAMIDES -->
  <a-scene environment="preset: egypt; ground: hills; groundColor: #c8963e; groundColor2: #996e2a; skyType: gradient; skyColor: #4a154b; horizonColor: #e76f51; dressing: pyramids; dressingAmount: 12; dressingScale: 4"
           cursor="rayOrigin: mouse"
           raycaster="objects: .clickable">

    <!-- PLATAFORMA DE PEDRA -->
    <a-cylinder position="0 0.05 0" radius="3.6" height="0.1" color="#582f0e" material="roughness: 0.9">
      <a-ring position="0 0.06 0" rotation="-90 0 0" radius-inner="3.3" radius-outer="3.45" color="#ffd700"></a-ring>
      <a-ring position="0 0.06 0" rotation="-90 0 0" radius-inner="2.0" radius-outer="2.05" color="#00f0ff"></a-ring>
    </a-cylinder>

    <!-- RIG & CONTROLES DE MÃO -->
    <a-entity id="rig" position="0 1.6 0">
      <a-camera id="camera" look-controls wasd-controls position="0 0 0">
        <a-ring radius-inner="0.007" radius-outer="0.012" color="#ffd700" position="0 0 -1" material="shader: flat; opacity: 0.7"></a-ring>
      </a-camera>

      <a-entity hand-tracking-controls="hand: left"
                laser-controls="hand: left"
                raycaster="objects: .clickable; lineColor: #00f0ff; lineOpacity: 0.9">
      </a-entity>

      <a-entity hand-tracking-controls="hand: right"
                laser-controls="hand: right"
                raycaster="objects: .clickable; lineColor: #ffd700; lineOpacity: 0.9">
      </a-entity>
    </a-entity>

    <!-- OBELISCO ESQUERDO (Afastado para 4.2m para dar amplitude) -->
    <a-entity position="-4.2 0 -2.6">
      <a-box width="0.7" height="4.5" depth="0.7" color="#7f5539" position="0 2.25 0" material="roughness: 0.8">
        <a-plane width="0.15" height="4.0" color="#00f0ff" position="0 0 0.36" material="shader: flat; opacity: 0.8"></a-plane>
      </a-box>
      <a-tetrahedron radius="0.5" color="#ffd700" position="0 4.7 0" rotation="0 45 0"></a-tetrahedron>
      <a-torus radius="0.8" radius-tubular="0.015" color="#ffd700" rotation="90 0 0" position="0 2.8 0"
               animation="property: rotation; to: 90 360 0; loop: true; dur: 8000; easing: linear"></a-torus>
      <a-light type="point" color="#00f0ff" intensity="1.2" distance="6" position="0 4 0"></a-light>
    </a-entity>

    <!-- OBELISCO DIREITO -->
    <a-entity position="4.2 0 -2.6">
      <a-box width="0.7" height="4.5" depth="0.7" color="#7f5539" position="0 2.25 0" material="roughness: 0.8">
        <a-plane width="0.15" height="4.0" color="#ffd700" position="0 0 0.36" material="shader: flat; opacity: 0.8"></a-plane>
      </a-box>
      <a-tetrahedron radius="0.5" color="#ffd700" position="0 4.7 0" rotation="0 45 0"></a-tetrahedron>
      <a-torus radius="0.8" radius-tubular="0.015" color="#00f0ff" rotation="90 0 0" position="0 2.8 0"
               animation="property: rotation; to: 90 -360 0; loop: true; dur: 8000; easing: linear"></a-torus>
      <a-light type="point" color="#ffd700" intensity="1.2" distance="6" position="0 4 0"></a-light>
    </a-entity>

    <!-- PAINEL PRINCIPAL AMPLIADO (Largura: 5.4m, Altura: 3.2m, Recuado para -3.4m) -->
    <a-entity id="main-sanctuary" position="0 1.6 -3.4">

      <!-- Fundo Escuro Proporcional -->
      <a-plane width="5.4" height="3.2" color="#1e100a"
               material="opacity: 0.94; roughness: 0.7; metalness: 0.2" position="0 0 0"></a-plane>

      <!-- Moldura Externa de Ouro -->
      <a-plane width="5.46" height="0.03" color="#ffd700" position="0 1.61 0.01"></a-plane>
      <a-plane width="5.46" height="0.03" color="#ffd700" position="0 -1.61 0.01"></a-plane>
      <a-plane width="0.03" height="3.24" color="#ffd700" position="-2.73 0 0.01"></a-plane>
      <a-plane width="0.03" height="3.24" color="#ffd700" position="2.73 0 0.01"></a-plane>

      <!-- Friso Ciano Superior -->
      <a-plane width="5.2" height="0.008" color="#00f0ff" position="0 1.35 0.02"></a-plane>

      <!-- CABECALHO BEM ESPACADO -->
      <a-text value="OS ARQUIVOS DE IMHOTEP // LINHA DO TEMPO DA MEDICINA" align="left" width="4.2" color="#ffd700"
              position="-2.5 1.45 0.03"></a-text>

      <a-text id="status-code" value="REGISTRO: 01 / 08" align="right" width="3.2" color="#00f0ff"
              position="2.5 1.45 0.03"></a-text>

      <!-- COLUNA DA ESQUERDA: Textos Perfeitamente Enquadrados -->
      <a-text id="card-title" value="" align="left" width="4.4" color="#ffffff"
              position="-2.5 1.15 0.03"></a-text>

      <a-text id="card-subtitle" value="" align="left" width="3.6" color="#e0a96d"
              position="-2.5 0.95 0.03"></a-text>

      <!-- Area de texto expandida com wrap-count calibrado para nao descer nos botoes -->
      <a-text id="card-content" value="" align="left" width="3.2" color="#fefae0"
              position="-2.5 0.75 0.03" baseline="top" wrap-count="42" line-height="54"></a-text>

      <!-- COLUNA DA DIREITA: Pedestal de Ouro do Artefato 3D -->
      <a-entity position="1.6 0.25 0">
        <a-cylinder radius="0.65" height="0.06" color="#7f5539" material="roughness: 0.9" position="0 -0.65 0">
          <a-ring radius-inner="0.67" radius-outer="0.70" color="#ffd700" rotation="-90 0 0" position="0 0.04 0"></a-ring>
        </a-cylinder>
        <a-entity id="relic-stage" position="0 0 0"></a-entity>
      </a-entity>

      <!-- TRILHO HORIZONTAL DE GLIFOS (Descido para y = -1.0) -->
      <a-entity id="stone-bar" position="0 -1.0 0">
        <a-plane width="3.4" height="0.008" color="#ffd700" position="0 0 0.02"></a-plane>
      </a-entity>

      <!-- BOTOES DE NAVEGACAO BEM POSICIONADOS NO RODAPE (y = -1.3) -->
      <a-box id="btn-prev" class="clickable" totem-interact="action: prev"
             width="1.1" height="0.25" depth="0.06" color="#8a5a36" position="-1.5 -1.3 0.04"
             material="roughness: 0.6">
        <a-plane width="1.1" height="0.012" color="#ffd700" position="0 0.12 0.04"></a-plane>
        <a-text value="<<< ANTERIOR" align="center" width="2.8" color="#ffffff" position="0 0 0.04"></a-text>
      </a-box>

      <a-box id="btn-next" class="clickable" totem-interact="action: next"
             width="1.1" height="0.25" depth="0.06" color="#8a5a36" position="1.5 -1.3 0.04"
             material="roughness: 0.6">
        <a-plane width="1.1" height="0.012" color="#ffd700" position="0 0.12 0.04"></a-plane>
        <a-text value="PROXIMO >>>" align="center" width="2.8" color="#ffffff" position="0 0 0.04"></a-text>
      </a-box>

    </a-entity>

    <!-- ILUMINACAO -->
    <a-light type="ambient" color="#3d1e11" intensity="1.8"></a-light>
    <a-light type="directional" color="#ffb703" intensity="1.4" position="5 6 -6"></a-light>
  </a-scene>
</body>
</html>
