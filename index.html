<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Templo da Medicina Ancestral // Egito VR</title>
  
  <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
  <script src="https://unpkg.com/aframe-environment-component@1.3.3/dist/aframe-environment-component.min.js"></script>

  <style>
    body { margin: 0; overflow: hidden; background: #000; }
  </style>

  <script>
    // Sintetizador de Áudio Procedural Místico-Cibernético (Web Audio API)
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
    function playEgyptianSound(type) {
      if (audioCtx.state === 'suspended') audioCtx.resume();
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      const now = audioCtx.currentTime;

      if (type === 'hover') {
        osc.type = 'sine';
        osc.frequency.setValueAtTime(440, now);
        osc.frequency.exponentialRampToValueAtTime(660, now + 0.12);
        gain.gain.setValueAtTime(0.05, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.12);
        osc.start(now);
        osc.stop(now + 0.12);
      } else if (type === 'portal') {
        osc.type = 'triangle';
        osc.frequency.setValueAtTime(140, now);
        osc.frequency.exponentialRampToValueAtTime(420, now + 0.35);
        gain.gain.setValueAtTime(0.12, now);
        gain.gain.exponentialRampToValueAtTime(0.001, now + 0.35);
        osc.start(now);
        osc.stop(now + 0.35);
      }
    }

    const timelineData = [
      {
        epoca: "I. EGITO PRIMORDIAL",
        periodo: "3000 a.C.",
        subtitulo: "A Aurora da Cura e da Anatomia Sagrada",
        topicos: [
          "[+] Papiro de Edwin Smith e Ebers: os primeiros tratados médicos da humanidade.",
          "[+] Uso refinado de mel, mirra, sais minerais e centenas de plantas curativas.",
          "[+] A mumificação revelou as primeiras cartografias anatômicas dos órgãos vitais.",
          "[+] Tratamento de traumas e redução de fraturas com talas de madeira e linho.",
          "[+] Imhotep: o primeiro médico da história, divinizado pela ciência da cura."
        ],
        artefato: "egypt"
      },
      {
        epoca: "II. GRÉCIA CLÁSSICA",
        periodo: "400 a.C.",
        subtitulo: "O Nascimento da Medicina Racional",
        topicos: [
          "[+] Hipócrates desmistifica a doença: causas naturais e não punição divina.",
          "[+] O Método Clínico: ausculta, inspeção e anotação sistemática da evolução.",
          "[+] Criação do Juramento de Hipócrates e da ética do exercício da cura.",
          "[+] Teoria dos quatro humores e a busca constante pela homeostase."
        ],
        artefato: "greece"
      },
      {
        epoca: "III. IDADE MÉDIA & ORIENTE",
        periodo: "500 a 1500",
        subtitulo: "A Luz dos Manuscritos e o Cânone",
        topicos: [
          "[+] Al-Razi (Rhazes) e Avicena compilam a maior enciclopédia médica da história.",
          "[+] Fundação das primeiras redes hospitalares organizadas (Bimaristan).",
          "[+] Tradução e preservação monumental dos tratados clássicos greco-romanos.",
          "[+] Cirurgias oculares e técnicas de extração de catarata com instrumentos finos."
        ],
        artefato: "middle_ages"
      },
      {
        epoca: "IV. O RENASCIMENTO",
        periodo: "1500 a 1600",
        subtitulo: "A Verdadeira Anatomia Revelada",
        topicos: [
          "[+] Andreas Vesalius rompe mais de 1000 anos de erros galênicos com dissecações.",
          "[+] Publicação da obra-prima 'De Humani Corporis Fabrica' (1543).",
          "[+] Leonardo da Vinci estuda a biomecânica e as válvulas do coração.",
          "[+] A observação direta suplanta definitivamente os dogmas teológicos."
        ],
        artefato: "renaissance"
      },
      {
        epoca: "V. SÉCULO XVII",
        periodo: "1600",
        subtitulo: "A Máquina Humana e o Infinitamente Pequeno",
        topicos: [
          "[+] William Harvey demonstra que o coração é uma bomba mecânica contínua (1628).",
          "[+] Invenção do microscópio óptico: o mundo invisível é desvelado.",
          "[+] Robert Hooke cunha o termo fundamental 'célula' em 1665.",
          "[+] Antonie van Leeuwenhoek observa 'animálculos' vivos nas águas e saliva."
        ],
        artefato: "microscope"
      },
      {
        epoca: "VI. SÉCULOS XVIII E XIX",
        periodo: "1700 a 1899",
        subtitulo: "A Tríade: Vacinas, Antissepsia e Raios-X",
        topicos: [
          "[+] 1796: Edward Jenner cria a vacina contra a varíola humana.",
          "[+] 1846: Morton demonstra publicamente a cirurgia indolor com éter etílico.",
          "[+] Louis Pasteur consolida a Teoria Germinativa e salva milhões com a pasteurização.",
          "[+] Joseph Lister institui o uso de antissépticos em salas cirúrgicas.",
          "[+] 1895: Wilhelm Röntgen descobre os raios invisíveis capazes de fotografar ossos."
        ],
        artefato: "xray"
      },
      {
        epoca: "VII. SÉCULO XX",
        periodo: "1900 a 1999",
        subtitulo: "Antibióticos, Genoma e Imagem Tridimensional",
        topicos: [
          "[+] 1928: Alexander Fleming descobre a penicilina, derrotando infecções fatais.",
          "[+] 1953: James Watson e Francis Crick desvendam a dupla hélice do DNA.",
          "[+] 1967: O primeiro transplante cardíaco com sucesso por Christiaan Barnard.",
          "[+] Revolução do diagnóstico por Tomografia Computadorizada e Ressonância.",
          "[+] Primeiros robôs entram em salas cirúrgicas para auxiliar biópsias cerebrais."
        ],
        artefato: "dna"
      },
      {
        epoca: "SÍNTESE // O LEGADO",
        periodo: "Século XXI+",
        subtitulo: "O Futuro da Cura",
        topicos: [
          "Da observação do corpo humano às tecnologias",
          "que revolucionaram os diagnósticos e tratamentos,",
          "cada descoberta abriu caminho para uma medicina",
          "mais precisa, segura e eficaz."
        ],
        artefato: "future"
      }
    ];

    let currentIndex = 0;

    function buildArtifact(type) {
      const stage = document.getElementById("relic-stage");
      stage.innerHTML = "";

      if (type === "egypt") {
        stage.innerHTML = `
          <!-- Pirâmide Dourada Flutuante -->
          <a-tetrahedron radius="0.55" color="#ffd700" material="metalness: 0.8; roughness: 0.2"
                         position="0 0 0" animation="property: rotation; to: 0 360 0; loop: true; dur: 9000; easing: linear">
            <a-ring radius-inner="0.65" radius-outer="0.67" color="#00f0ff" rotation="90 0 0"></a-ring>
          </a-tetrahedron>
          <a-sphere radius="0.12" color="#00ffff" position="0 0.5 0"
                    animation="property: position; to: 0 0.65 0; dir: alternate; loop: true; dur: 1200"></a-sphere>
        `;
      } else if (type === "greece") {
        stage.innerHTML = `
          <!-- Cajado de Asclépio Solar -->
          <a-cylinder radius="0.04" height="0.9" color="#e2d4b7" position="0 0 0"></a-cylinder>
          <a-torus radius="0.32" radius-tubular="0.02" color="#00f0ff" rotation="60 30 0"
                   animation="property: rotation; to: 60 390 0; loop: true; dur: 8000; easing: linear"></a-torus>
          <a-sphere radius="0.1" color="#ffd700" position="0 0.5 0"></a-sphere>
        `;
      } else if (type === "middle_ages") {
        stage.innerHTML = `
          <!-- O Livro Sagrado do Cânone Holográfico -->
          <a-box width="0.5" height="0.65" depth="0.12" color="#b08968" position="0 0 0"
                 animation="property: rotation; to: 0 360 0; loop: true; dur: 10000; easing: linear">
            <a-plane width="0.4" height="0.55" color="#00f0ff" position="0 0 0.07" material="wireframe: true"></a-plane>
          </a-box>
        `;
      } else if (type === "renaissance") {
        stage.innerHTML = `
          <!-- Homem Vitruviano em Esfera Armilar -->
          <a-sphere radius="0.4" color="#d4a373" wireframe="true"
                    animation="property: rotation; to: 360 360 0; loop: true; dur: 12000; easing: linear"></a-sphere>
          <a-ring radius-inner="0.48" radius-outer="0.5" color="#00f0ff" rotation="45 45 0"
                  animation="property: rotation; to: 45 405 0; loop: true; dur: 6000; easing: linear"></a-ring>
        `;
      } else if (type === "microscope") {
        stage.innerHTML = `
          <!-- Prisma de Foco e Óptica -->
          <a-octahedron radius="0.4" color="#00ffff" material="opacity: 0.7; transparent: true; roughness: 0.1"
                        animation="property: rotation; to: 0 360 360; loop: true; dur: 8000; easing: linear"></a-octahedron>
        `;
      } else if (type === "xray") {
        stage.innerHTML = `
          <!-- Cristais de Tubo de Crookes / Radiação -->
          <a-dodecahedron radius="0.38" color="#00ff88" wireframe="true"
                          animation="property: rotation; to: 360 0 360; loop: true; dur: 7000; easing: linear"></a-dodecahedron>
          <a-sphere radius="0.1" color="#ffffff" animation="property: scale; to: 1.8 1.8 1.8; dir: alternate; loop: true; dur: 900"></a-sphere>
        `;
      } else if (type === "dna") {
        stage.innerHTML = `
          <!-- Dupla Hélice com Matriz de Plasma -->
          <a-entity animation="property: rotation; to: 0 360 0; loop: true; dur: 5000; easing: linear">
            <a-sphere position="0.25 0.35 0" radius="0.09" color="#00f0ff"></a-sphere>
            <a-sphere position="-0.25 0.35 0" radius="0.09" color="#e63946"></a-sphere>
            <a-cylinder position="0 0.35 0" rotation="0 0 90" radius="0.02" height="0.5" color="#ffd700"></a-cylinder>

            <a-sphere position="0 0 0.25" radius="0.09" color="#00f0ff"></a-sphere>
            <a-sphere position="0 0 -0.25" radius="0.09" color="#e63946"></a-sphere>
            <a-cylinder position="0 0 0" rotation="90 0 0" radius="0.02" height="0.5" color="#ffd700"></a-cylinder>

            <a-sphere position="-0.25 -0.35 0" radius="0.09" color="#00f0ff"></a-sphere>
            <a-sphere position="0.25 -0.35 0" radius="0.09" color="#e63946"></a-sphere>
            <a-cylinder position="0 0 90" rotation="0 0 90" radius="0.02" height="0.5" color="#ffd700"></a-cylinder>
          </a-entity>
        `;
      } else {
        stage.innerHTML = `
          <!-- Orbe da Medicina Quântica -->
          <a-sphere radius="0.38" color="#ffd700" wireframe="true"
                    animation="property: rotation; to: 360 360 0; loop: true; dur: 4000; easing: linear"></a-sphere>
          <a-ring radius-inner="0.45" radius-outer="0.48" color="#00f0ff"
                  animation="property: rotation; to: 0 360 360; loop: true; dur: 3000; easing: linear"></a-ring>
        `;
      }
    }

    function renderDisplay(index) {
      const data = timelineData[index];
      document.getElementById("card-title").setAttribute("value", `${data.epoca} [${data.periodo}]`);
      document.getElementById("card-subtitle").setAttribute("value", data.subtitulo);
      document.getElementById("card-content").setAttribute("value", data.topicos.join("\n\n"));
      document.getElementById("status-code").setAttribute("value", `INSCRIÇÃO: 0${index + 1} / 0${timelineData.length}`);

      buildArtifact(data.artefato);

      // Atualiza luzes dos nós na fita sagrada
      for (let i = 0; i < timelineData.length; i++) {
        const stone = document.getElementById(`stone-${i}`);
        if (stone) {
          if (i === index) {
            stone.setAttribute("color", "#00ffff");
            stone.setAttribute("material", "emissive: #00ffff; emissiveIntensity: 0.8");
            stone.setAttribute("scale", "1.3 1.3 1.3");
          } else {
            stone.setAttribute("color", "#7f5539");
            stone.setAttribute("material", "emissive: #000; emissiveIntensity: 0");
            stone.setAttribute("scale", "1 1 1");
          }
        }
      }
    }

    AFRAME.registerComponent('totem-interact', {
      schema: { action: { type: 'string' }, targetIndex: { type: 'int', default: -1 } },
      init: function () {
        const el = this.el;
        const data = this.data;

        el.addEventListener('mouseenter', () => {
          playEgyptianSound('hover');
          el.setAttribute('material', 'color', '#00f0ff');
          el.setAttribute('scale', '1.05 1.05 1.05');
        });

        el.addEventListener('mouseleave', () => {
          el.setAttribute('material', 'color', '#b08968');
          el.setAttribute('scale', '1 1 1');
        });

        el.addEventListener('click', () => {
          playEgyptianSound('portal');
          if (data.action === 'next' && currentIndex < timelineData.length - 1) {
            currentIndex++;
            renderDisplay(currentIndex);
          } else if (data.action === 'prev' && currentIndex > 0) {
            currentIndex--;
            renderDisplay(currentIndex);
          } else if (data.action === 'jump') {
            currentIndex = data.targetIndex;
            renderDisplay(currentIndex);
          }
        });
      }
    });

    window.addEventListener('DOMContentLoaded', () => {
      // Monta os glifos de navegação no painel horizontal
      const stoneBar = document.getElementById("stone-bar");
      const total = timelineData.length;
      const startX = -1.3;
      const step = 2.6 / (total - 1);

      for (let i = 0; i < total; i++) {
        const stone = document.createElement("a-octahedron");
        stone.setAttribute("id", `stone-${i}`);
        stone.setAttribute("class", "clickable");
        stone.setAttribute("radius", "0.06");
        stone.setAttribute("color", "#7f5539");
        stone.setAttribute("position", `${startX + (i * step)} 0 0.05`);
        stone.setAttribute("totem-interact", `action: jump; targetIndex: ${i}`);
        stoneBar.appendChild(stone);
      }

      renderDisplay(0);
    });
  </script>
</head>
<body>
  <!-- AMBIENTE: DESERTO DO EGITO COM DUNA, CÉU CREPUSCULAR E PIRÂMIDES -->
  <a-scene environment="preset: egypt; ground: hills; groundColor: #c8963e; groundColor2: #996e2a; skyType: gradient; skyColor: #4a154b; horizonColor: #e76f51; dressing: pyramids; dressingAmount: 12; dressingScale: 4"
           cursor="rayOrigin: mouse"
           raycaster="objects: .clickable">

    <!-- PLATAFORMA DE PEDRA DO FARAÓ ONDE O USUÁRIO FICA EM PÉ -->
    <a-cylinder position="0 0.05 0" radius="3.2" height="0.1" color="#582f0e" material="roughness: 0.9; metalness: 0.1">
      <a-ring position="0 0.06 0" rotation="-90 0 0" radius-inner="3.0" radius-outer="3.15" color="#ffd700"></a-ring>
      <a-ring position="0 0.06 0" rotation="-90 0 0" radius-inner="1.8" radius-outer="1.85" color="#00f0ff"></a-ring>
    </a-cylinder>

    <!-- CÂMERA & RASTREAMENTO DAS MÃOS NO META QUEST 3 -->
    <a-entity id="rig" position="0 1.6 0">
      <a-camera id="camera" look-controls wasd-controls position="0 0 0">
        <!-- Retículo sagrado com anel duplo -->
        <a-ring radius-inner="0.007" radius-outer="0.012" color="#ffd700" position="0 0 -1" material="shader: flat; opacity: 0.7"></a-ring>
      </a-camera>

      <!-- Mão Esquerda (Laser Dourado/Ciano) -->
      <a-entity hand-tracking-controls="hand: left"
                laser-controls="hand: left"
                raycaster="objects: .clickable; lineColor: #00f0ff; lineOpacity: 0.9">
      </a-entity>

      <!-- Mão Direita (Laser Ouro Sagrado) -->
      <a-entity hand-tracking-controls="hand: right"
                laser-controls="hand: right"
                raycaster="objects: .clickable; lineColor: #ffd700; lineOpacity: 0.9">
      </a-entity>
    </a-entity>

    <!-- TOTEM ESQUERDO: OBELISCO DE AREIA COM ANÉIS DE PLASMA -->
    <a-entity position="-3.5 0 -2.6">
      <a-box width="0.7" height="4.5" depth="0.7" color="#7f5539" position="0 2.25 0" material="roughness: 0.8">
        <!-- Runas verticais luminosas -->
        <a-plane width="0.15" height="4.0" color="#00f0ff" position="0 0 0.36" material="shader: flat; opacity: 0.8"></a-plane>
      </a-box>
      <a-tetrahedron radius="0.5" color="#ffd700" position="0 4.7 0" rotation="0 45 0"></a-tetrahedron>
      <!-- Anel flutuante de energia ao redor do totem -->
      <a-torus radius="0.8" radius-tubular="0.015" color="#ffd700" rotation="90 0 0" position="0 2.8 0"
               animation="property: rotation; to: 90 360 0; loop: true; dur: 8000; easing: linear"></a-torus>
      <!-- Foco de luz do totem -->
      <a-light type="point" color="#00f0ff" intensity="1.2" distance="6" position="0 4 0"></a-light>
    </a-entity>

    <!-- TOTEM DIREITO: OBELISCO GÊMEO COM GLIFOS E FOGO HOLOGRÁFICO -->
    <a-entity position="3.5 0 -2.6">
      <a-box width="0.7" height="4.5" depth="0.7" color="#7f5539" position="0 2.25 0" material="roughness: 0.8">
        <a-plane width="0.15" height="4.0" color="#ffd700" position="0 0 0.36" material="shader: flat; opacity: 0.8"></a-plane>
      </a-box>
      <a-tetrahedron radius="0.5" color="#ffd700" position="0 4.7 0" rotation="0 45 0"></a-tetrahedron>
      <a-torus radius="0.8" radius-tubular="0.015" color="#00f0ff" rotation="90 0 0" position="0 2.8 0"
               animation="property: rotation; to: 90 -360 0; loop: true; dur: 8000; easing: linear"></a-torus>
      <a-light type="point" color="#ffd700" intensity="1.2" distance="6" position="0 4 0"></a-light>
    </a-entity>

    <!-- ESTAÇÃO PRINCIPAL: O GRANDE ALTAR DO CONHECIMENTO MÉDICO -->
    <a-entity id="main-sanctuary" position="0 1.6 -3.1">

      <!-- Monólito de Arenito Escuro com Borda de Ouro -->
      <a-plane width="4.4" height="2.6" color="#2b1810"
               material="opacity: 0.94; roughness: 0.7; metalness: 0.2" position="0 0 0"></a-plane>

      <!-- Moldura Externa de Ouro Maciço Egípcio -->
      <a-plane width="4.46" height="0.03" color="#ffd700" position="0 1.31 0.01"></a-plane>
      <a-plane width="4.46" height="0.03" color="#ffd700" position="0 -1.31 0.01"></a-plane>
      <a-plane width="0.03" height="2.64" color="#ffd700" position="-2.23 0 0.01"></a-plane>
      <a-plane width="0.03" height="2.64" color="#ffd700" position="2.23 0 0.01"></a-plane>

      <!-- Friso de Borda Ciano Arcano -->
      <a-plane width="4.3" height="0.006" color="#00f0ff" position="0 1.1 0.02"></a-plane>

      <!-- Título de Cabeçalho do Templo -->
      <a-text value="OS ARQUIVOS DE IMHOTEP // LINHA DO TEMPO DA MEDICINA" align="left" width="3.6" color="#ffd700"
              position="-2.0 1.18 0.03" font="kelsonsans"></a-text>

      <a-text id="status-code" value="INSCRIÇÃO: 01 / 08" align="right" width="3.2" color="#00f0ff"
              position="2.0 1.18 0.03" font="monoid"></a-text>

      <!-- COLUNA DA ESQUERDA: Textos da Época Médica -->
      <a-text id="card-title" value="" align="left" width="3.7" color="#ffffff"
              position="-2.0 0.85 0.03" font="kelsonsans"></a-text>

      <a-text id="card-subtitle" value="" align="left" width="2.9" color="#e0a96d"
              position="-2.0 0.65 0.03" font="roboto" style="bold"></a-text>

      <a-text id="card-content" value="" align="left" width="2.7" color="#fefae0"
              position="-2.0 0.45 0.03" font="monoid" baseline="top" wrap-count="37" line-height="54"></a-text>

      <!-- COLUNA DA DIREITA: Pedestal de Ouro do Artefato -->
      <a-entity position="1.2 0.05 0">
        <!-- Altar com Bacia de Fogo Azul -->
        <a-cylinder radius="0.6" height="0.06" color="#7f5539" material="roughness: 0.9" position="0 -0.55 0">
          <a-ring radius-inner="0.62" radius-outer="0.65" color="#ffd700" rotation="-90 0 0" position="0 0.04 0"></a-ring>
        </a-cylinder>
        <a-entity id="relic-stage" position="0 0 0"></a-entity>
      </a-entity>

      <!-- FITA DAS PEDRAS DE GLIFO (Navegação Rápida) -->
      <a-entity id="stone-bar" position="0 -0.76 0">
        <a-plane width="2.7" height="0.01" color="#ffd700" position="0 0 0.02"></a-plane>
      </a-entity>

      <!-- TOTENS / BOTÕES DE TRANSIÇÃO -->
      <a-box id="btn-prev" class="clickable" totem-interact="action: prev"
             width="0.9" height="0.22" depth="0.06" color="#b08968" position="-1.2 -1.06 0.04"
             material="roughness: 0.6">
        <a-plane width="0.9" height="0.01" color="#ffd700" position="0 0.11 0.04"></a-plane>
        <a-text value="<<< EPOCA ANTERIOR" align="center" width="2.3" color="#ffffff" font="kelsonsans" position="0 0 0.04"></a-text>
      </a-box>

      <a-box id="btn-next" class="clickable" totem-interact="action: next"
             width="0.9" height="0.22" depth="0.06" color="#b08968" position="1.2 -1.06 0.04"
             material="roughness: 0.6">
        <a-plane width="0.9" height="0.01" color="#ffd700" position="0 0.11 0.04"></a-plane>
        <a-text value="PROXIMA EPOCA >>>" align="center" width="2.3" color="#ffffff" font="kelsonsans" position="0 0 0.04"></a-text>
      </a-box>

    </a-entity>

    <!-- ILUMINAÇÃO DE PÔR DO SOL NO DESERTO -->
    <a-light type="ambient" color="#3d1e11" intensity="1.8"></a-light>
    <!-- Sol Dourado no horizonte -->
    <a-light type="directional" color="#ffb703" intensity="1.4" position="5 6 -6"></a-light>
  </a-scene>
</body>
</html>
